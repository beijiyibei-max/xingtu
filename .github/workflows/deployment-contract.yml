name: Deployment contract

on:
  push:
    paths:
      - "deployment/**"
      - "test/test_deployment_contract.py"
      - ".github/workflows/deployment-contract.yml"
  pull_request:
    paths:
      - "deployment/**"
      - "test/test_deployment_contract.py"
      - ".github/workflows/deployment-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r deployment/requirements-contract.txt
      - run: python -m unittest discover -s test -p test_deployment_contract.py -v
