<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; worker-src 'none'; media-src 'none'">
  <title>星图 · 保密现场模式</title>
  <style>:root {
  color-scheme: dark;
  --bg: #071017;
  --bg-deep: #04090e;
  --panel: rgba(13, 27, 37, 0.9);
  --panel-soft: rgba(15, 34, 46, 0.7);
  --line: rgba(137, 183, 204, 0.14);
  --line-strong: rgba(137, 183, 204, 0.28);
  --text: #e9f4f5;
  --muted: #89a2ad;
  --dim: #5d737d;
  --cyan: #44e2d1;
  --cyan-soft: rgba(68, 226, 209, 0.12);
  --violet: #9d8cff;
  --green: #75dc9b;
  --amber: #f2ba63;
  --pink: #ef7fbd;
  --danger: #ff7182;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg-deep);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 76% 4%, rgba(46, 151, 164, 0.15), transparent 30%),
    radial-gradient(circle at 16% 48%, rgba(75, 96, 162, 0.1), transparent 34%),
    linear-gradient(145deg, #071017 0%, #08131b 45%, #050c12 100%);
  font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
}

body::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  content: "";
  pointer-events: none;
  opacity: 0.28;
  background-image:
    linear-gradient(rgba(113, 173, 190, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(113, 173, 190, 0.04) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: linear-gradient(to bottom, black, transparent 88%);
}

button,
select {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:focus-visible,
select:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  min-height: 72px;
  align-items: center;
  gap: 28px;
  padding: 0 34px;
  border-bottom: 1px solid var(--line);
  background: rgba(4, 11, 16, 0.86);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  min-width: 230px;
  align-items: center;
  gap: 13px;
}

.brand-mark {
  position: relative;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(68, 226, 209, 0.48);
  border-radius: 50%;
  box-shadow: inset 0 0 18px rgba(68, 226, 209, 0.14), 0 0 18px rgba(68, 226, 209, 0.08);
}

.brand-mark::before,
.brand-mark::after {
  position: absolute;
  content: "";
  border: 1px solid rgba(68, 226, 209, 0.34);
  border-radius: 50%;
  transform: rotate(-22deg);
}

.brand-mark::before {
  inset: 7px -6px;
}

.brand-mark::after {
  inset: 14px -3px;
}

.brand-mark span {
  position: absolute;
  top: 13px;
  left: 13px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 16px var(--cyan);
}

.brand-mark i {
  position: absolute;
  top: 2px;
  right: 3px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--amber);
}

.brand strong {
  display: block;
  font-size: 18px;
  letter-spacing: 0.16em;
}

.brand small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.security-state {
  display: flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.status-pill,
.mode-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: #a8bbc3;
  background: rgba(12, 27, 35, 0.62);
  font-size: 11px;
}

.status-pill i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #718993;
}

.status-pill.safe {
  color: #9ce9c0;
  border-color: rgba(117, 220, 155, 0.2);
  background: rgba(45, 118, 76, 0.09);
}

.status-pill.safe i {
  background: var(--green);
  box-shadow: 0 0 10px rgba(117, 220, 155, 0.7);
}

.mode-pill {
  color: var(--cyan);
  border-color: rgba(68, 226, 209, 0.24);
  background: var(--cyan-soft);
}

.header-spacer {
  min-width: 132px;
}

.end-button {
  min-width: 132px;
  padding: 9px 13px;
  border: 1px solid rgba(255, 113, 130, 0.26);
  border-radius: 8px;
  color: #ff9ba7;
  background: rgba(255, 113, 130, 0.06);
  font-size: 12px;
}

.end-button:hover {
  border-color: rgba(255, 113, 130, 0.5);
  background: rgba(255, 113, 130, 0.12);
}

.security-strip {
  display: flex;
  min-height: 34px;
  align-items: center;
  gap: 21px;
  padding: 0 34px;
  border-bottom: 1px solid rgba(137, 183, 204, 0.08);
  color: var(--muted);
  background: rgba(8, 20, 27, 0.78);
  font-size: 10px;
}

.security-strip span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.security-strip b {
  padding: 2px 4px;
  color: var(--cyan);
  border: 1px solid rgba(68, 226, 209, 0.22);
  border-radius: 3px;
  font: 9px Consolas, monospace;
}

.security-strip em {
  overflow: hidden;
  margin-left: auto;
  color: #6f8791;
  font-style: normal;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.step-rail {
  display: flex;
  max-width: 1160px;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
  padding: 25px 28px 0;
}

.step-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dim);
  font-size: 11px;
  letter-spacing: 0.06em;
}

.step-item span {
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  font: 10px Consolas, monospace;
}

.step-item.active {
  color: var(--text);
}

.step-item.active span {
  color: #05201e;
  border-color: var(--cyan);
  background: var(--cyan);
  box-shadow: 0 0 20px rgba(68, 226, 209, 0.22);
}

.step-item.complete {
  color: #8eb4af;
}

.step-item.complete span {
  color: var(--cyan);
  border-color: rgba(68, 226, 209, 0.35);
  background: rgba(68, 226, 209, 0.08);
}

.step-rail > i {
  width: 90px;
  height: 1px;
  margin: 0 14px;
  background: linear-gradient(90deg, var(--line-strong), var(--line));
}

.page {
  width: min(1380px, calc(100% - 56px));
  min-height: calc(100vh - 218px);
  margin: 0 auto;
  padding: 38px 0 64px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(155deg, rgba(16, 34, 45, 0.93), rgba(9, 23, 31, 0.86));
  box-shadow: var(--shadow);
}

.eyebrow {
  display: block;
  color: var(--cyan);
  font: 10px/1.4 Consolas, "Microsoft YaHei UI", monospace;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.hero-grid {
  display: grid;
  max-width: 1160px;
  grid-template-columns: 1.2fr 0.8fr;
  align-items: center;
  gap: 60px;
  margin: 12px auto 38px;
}

.hero-copy h1 {
  margin: 13px 0 18px;
  font-size: clamp(38px, 5vw, 68px);
  font-weight: 350;
  line-height: 1.08;
  letter-spacing: -0.04em;
}

.hero-copy h1 span {
  color: var(--cyan);
}

.hero-copy p {
  max-width: 620px;
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.orbit-visual {
  position: relative;
  width: 270px;
  height: 210px;
  justify-self: center;
}

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  border: 1px solid rgba(68, 226, 209, 0.2);
  border-radius: 50%;
  transform: translate(-50%, -50%) rotate(-18deg);
}

.orbit-one {
  width: 250px;
  height: 94px;
}

.orbit-two {
  width: 178px;
  height: 178px;
  border-color: rgba(157, 140, 255, 0.14);
  transform: translate(-50%, -50%) rotate(36deg);
}

.orbit i {
  position: absolute;
  top: 5px;
  right: 47px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 14px var(--cyan);
}

.orbit-two i {
  top: auto;
  right: auto;
  bottom: 18px;
  left: 17px;
  background: var(--violet);
  box-shadow: 0 0 14px var(--violet);
}

.core-orb {
  position: absolute;
  top: 50%;
  left: 50%;
  display: grid;
  width: 104px;
  height: 104px;
  place-content: center;
  border: 1px solid rgba(68, 226, 209, 0.38);
  border-radius: 50%;
  text-align: center;
  background: radial-gradient(circle at 36% 30%, rgba(77, 225, 214, 0.24), rgba(11, 42, 48, 0.96) 60%, #071117 100%);
  box-shadow: inset -12px -14px 25px rgba(0, 0, 0, 0.3), 0 0 44px rgba(68, 226, 209, 0.12);
  transform: translate(-50%, -50%);
}

.core-orb span {
  color: var(--cyan);
  font: 34px/1 Consolas, monospace;
}

.core-orb small {
  margin-top: 6px;
  color: #98b8bb;
  font-size: 10px;
}

.preflight-layout {
  display: grid;
  max-width: 1160px;
  grid-template-columns: 1fr 330px;
  gap: 16px;
  margin: 0 auto;
}

.permission-panel {
  padding: 24px;
}

.panel-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.panel-heading > div {
  display: flex;
  align-items: center;
  gap: 10px;
}

.panel-heading h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
}

.panel-heading p {
  max-width: 390px;
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  text-align: right;
}

.section-index {
  color: var(--cyan);
  font: 11px Consolas, monospace;
}

.permission-question {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 17px 0;
  border-top: 1px solid var(--line);
}

.permission-question b {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
}

.permission-question small {
  color: var(--muted);
  font-size: 10px;
}

.choice-group {
  display: flex;
  flex: 0 0 auto;
  gap: 7px;
}

.choice-button {
  min-width: 74px;
  padding: 8px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  color: #94aab3;
  background: rgba(7, 17, 23, 0.65);
  font-size: 11px;
}

.choice-button:hover,
.choice-button.selected {
  color: var(--cyan);
  border-color: rgba(68, 226, 209, 0.5);
  background: var(--cyan-soft);
}

.locked-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding-top: 17px;
  border-top: 1px solid var(--line);
}

.locked-grid div {
  display: grid;
  grid-template-columns: 22px 1fr;
  align-items: center;
  padding: 10px;
  border: 1px solid rgba(255, 113, 130, 0.1);
  border-radius: 8px;
  background: rgba(255, 113, 130, 0.035);
}

.locked-grid span {
  grid-row: 1 / 3;
  color: var(--danger);
  font-size: 15px;
}

.locked-grid b {
  color: #b9c9cf;
  font-size: 10px;
}

.locked-grid small {
  margin-top: 2px;
  color: #697f87;
  font-size: 9px;
}

.mode-preview {
  display: flex;
  min-height: 330px;
  flex-direction: column;
  padding: 26px;
  overflow: hidden;
}

.mode-preview::before {
  align-self: flex-end;
  width: 86px;
  height: 1px;
  content: "";
  background: linear-gradient(90deg, transparent, var(--line-strong));
}

.preview-label {
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.mode-preview > strong {
  margin: 20px 0 3px;
  color: #5c757f;
  font: 56px/1 Consolas, monospace;
}

.mode-preview.ready > strong {
  color: var(--cyan);
  text-shadow: 0 0 28px rgba(68, 226, 209, 0.2);
}

.mode-preview h3 {
  margin: 3px 0 10px;
  font-size: 19px;
  font-weight: 550;
}

.mode-preview p {
  margin: 0 0 17px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.mode-preview .primary-button {
  width: 100%;
  margin-top: auto;
}

.warning-note {
  padding: 10px 12px;
  border: 1px solid rgba(242, 186, 99, 0.22);
  border-radius: 7px;
  color: #d8b77e;
  background: rgba(242, 186, 99, 0.07);
  font-size: 10px;
  line-height: 1.6;
}

.primary-button,
.secondary-button,
.danger-button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 0 16px;
  border-radius: 8px;
  font-size: 11px;
}

.primary-button {
  color: #06201e;
  background: var(--cyan);
  box-shadow: 0 10px 30px rgba(68, 226, 209, 0.12);
}

.primary-button:hover {
  background: #62ebdc;
}

.secondary-button {
  color: #a8bbc3;
  border: 1px solid var(--line-strong);
  background: rgba(13, 28, 37, 0.7);
}

.secondary-button:hover {
  color: var(--text);
  border-color: rgba(68, 226, 209, 0.32);
}

.danger-button {
  color: #29070c;
  background: var(--danger);
}

.page-heading,
.workspace-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin: 4px 0 25px;
}

.page-heading h1,
.workspace-heading h1 {
  margin: 7px 0 8px;
  font-size: 30px;
  font-weight: 450;
}

.page-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.text-button,
.back-link {
  padding: 7px 0;
  color: var(--muted);
  background: transparent;
  font-size: 11px;
}

.text-button:hover,
.back-link:hover {
  color: var(--cyan);
}

.policy-banner {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 17px;
  padding: 11px 15px;
  border: 1px solid rgba(68, 226, 209, 0.16);
  border-radius: 9px;
  background: rgba(68, 226, 209, 0.05);
}

.policy-banner b {
  color: var(--cyan);
  font-size: 11px;
}

.policy-banner span {
  color: var(--muted);
  font-size: 10px;
}

.policy-banner.danger {
  border-color: rgba(255, 113, 130, 0.2);
  background: rgba(255, 113, 130, 0.05);
}

.policy-banner.danger b {
  color: #ff94a1;
}

.symptom-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.symptom-card {
  position: relative;
  min-height: 212px;
  padding: 21px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  text-align: left;
  background: linear-gradient(150deg, rgba(16, 34, 45, 0.9), rgba(8, 20, 28, 0.88));
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.symptom-card::after {
  position: absolute;
  right: -40px;
  bottom: -54px;
  width: 130px;
  height: 130px;
  content: "";
  border: 1px solid rgba(68, 226, 209, 0.1);
  border-radius: 50%;
}

.symptom-card:hover {
  z-index: 1;
  border-color: rgba(68, 226, 209, 0.38);
  background: linear-gradient(150deg, rgba(20, 46, 56, 0.96), rgba(9, 25, 32, 0.92));
  transform: translateY(-3px);
}

.symptom-icon {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  margin-bottom: 30px;
  border: 1px solid rgba(68, 226, 209, 0.22);
  border-radius: 50%;
  color: var(--cyan);
  background: var(--cyan-soft);
  font-size: 16px;
}

.symptom-order {
  position: absolute;
  top: 23px;
  right: 23px;
  color: #516974;
  font: 10px Consolas, monospace;
}

.symptom-card h2 {
  margin: 0 0 9px;
  font-size: 15px;
  font-weight: 550;
}

.symptom-card p {
  min-height: 36px;
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.7;
}

.symptom-card > i {
  display: block;
  margin-top: 16px;
  color: #6e8d94;
  font-size: 9px;
  font-style: normal;
}

.workspace-heading {
  align-items: center;
  margin-top: -5px;
}

.workspace-heading > div:first-child {
  display: flex;
  align-items: center;
  gap: 13px;
}

.workspace-heading h1 {
  margin: 2px 0 0;
  font-size: 20px;
}

.workspace-heading small {
  color: var(--muted);
  font-size: 9px;
}

.symptom-mini {
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid rgba(68, 226, 209, 0.25);
  border-radius: 50%;
  color: var(--cyan);
  background: var(--cyan-soft);
}

.workspace-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.workspace-actions > span {
  max-width: 280px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
  text-align: right;
}

.workspace-grid.l0-grid {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 15px;
}

.guide-panel {
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(155deg, rgba(16, 34, 45, 0.93), rgba(9, 23, 31, 0.86));
  box-shadow: var(--shadow);
}

.guide-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.guide-head h2 {
  margin: 5px 0 0;
  font-size: 19px;
}

.guide-head > span {
  color: var(--cyan);
  font: 12px Consolas, monospace;
}

.guide-progress {
  height: 2px;
  margin: 19px 0 8px;
  overflow: hidden;
  border-radius: 2px;
  background: rgba(137, 183, 204, 0.1);
}

.guide-progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), #72a9dd);
  transition: width 220ms ease;
}

.guide-steps {
  padding-left: 5px;
}

.guide-step {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  padding: 14px 0;
  opacity: 0.38;
  border-bottom: 1px solid rgba(137, 183, 204, 0.08);
}

.guide-step.active,
.guide-step.passed {
  opacity: 1;
}

.step-dot {
  display: grid;
  width: 27px;
  height: 27px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 50%;
  font: 10px Consolas, monospace;
}

.guide-step small {
  color: var(--muted);
  font-size: 9px;
  text-transform: uppercase;
}

.guide-step h3 {
  margin: 3px 0 5px;
  font-size: 13px;
}

.guide-step p,
.guide-step em {
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  font-style: normal;
  line-height: 1.7;
}

.guide-step em {
  display: block;
  margin-top: 7px;
  color: #a8d9d4;
}

.guide-actions {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding-top: 18px;
}

.guide-finished {
  color: #9ed8b5;
  font-size: 10px;
}

.boundary-card {
  align-self: start;
  padding: 25px;
}

.boundary-card h2 {
  margin: 11px 0;
  font-size: 20px;
  line-height: 1.45;

function deriveMode(permissions = {}) {
  return permissions.toolDuringSession === 'yes' && permissions.anonymousJudgement === 'yes' ? MODES.L1 : MODES.L0;
}

function createInitialObjects() {
  return {
    products: [{ id: 'P1' }],
    services: [
      { id: 'S1', productId: 'P1', nodeId: 'N1' },
      { id: 'S2', productId: 'P1', nodeId: 'N1' },
      { id: 'S3', productId: 'P1', nodeId: 'N2' }
    ],
    nodes: [{ id: 'N1' }, { id: 'N2' }],
    relations: [{ source: 'S1', target: 'S2' }, { source: 'S2', target: 'S3' }]
  };
}

function confidenceFor(score, sourceCount) {
  if (score >= 70 && sourceCount >= 3) return 'high';
  if (score >= 40) return 'medium';
  return 'low';
}

function scoreCandidates(services = [], evidence = {}) {
  return services.map(service => {
    const answers = evidence[service.id] || {};
    const categoryScores = {};
    const categoryReasons = {};
    let propagation = false;
    let incompleteTrace = false;

    for (const definition of EVIDENCE_DEFINITIONS) {
      if (answers[definition.id] !== 'confirmed') continue;
      if (definition.propagation) propagation = true;
      if (definition.id === 'trace-incomplete') incompleteTrace = true;
      if (definition.points <= 0) continue;
      const cap = CATEGORY_META[definition.category].cap;
      const points = Math.min(definition.points, cap);
      if (points > (categoryScores[definition.category] || 0)) {
        categoryScores[definition.category] = points;
        categoryReasons[definition.category] = definition;
      }
    }

    const score = Object.values(categoryScores).reduce((sum, points) => sum + points, 0);
    const evidenceSources = Object.keys(categoryScores);
    const reasons = evidenceSources.map(category => ({
      category,
      points: categoryScores[category],
      title: categoryReasons[category].title,
      detail: categoryReasons[category].detail
    }));
    return {
      subjectAlias: service.id,
      score,
      confidence: confidenceFor(score, evidenceSources.length),
      evidenceSources,
      reasons,
      propagation,
      incompleteTrace
    };
  }).filter(candidate => candidate.score > 0)
    .sort((a, b) => b.score - a.score || b.evidenceSources.length - a.evidenceSources.length || a.subjectAlias.localeCompare(b.subjectAlias))
    .slice(0, 3);
}

function evidenceProgress(services = [], evidence = {}) {
  const total = services.length * EVIDENCE_DEFINITIONS.length;
  const answered = services.reduce((count, service) => count + Object.values(evidence[service.id] || {}).filter(value => value && value !== 'unknown').length, 0);
  const forbidden = services.reduce((count, service) => count + Object.values(evidence[service.id] || {}).filter(value => value === 'forbidden').length, 0);
  return { total, answered, forbidden, percent: total ? Math.round(answered / total * 100) : 0 };
}

function missingEvidence(candidate) {
  if (!candidate) return Object.keys(CATEGORY_META);
  return Object.keys(CATEGORY_META).filter(category => !candidate.evidenceSources.includes(category));
}

      </article>`).join('')}
    </div>
    <div class="guide-actions">
      <button class="secondary-button" type="button" data-guide-prev ${activeIndex === 0 ? 'disabled' : ''}>← 上一步</button>
      ${activeIndex < steps.length - 1 ? '<button class="primary-button" type="button" data-guide-next>下一项核验 <span>→</span></button>' : '<span class="guide-finished">通用路线已阅读；星图没有记录任何现场结论。</span>'}
    </div>
  </section>`;
}

function renderL0Workspace() {
  return `<div class="workspace-grid l0-grid">
    ${renderGuide()}
    <aside class="panel boundary-card">
      <span class="eyebrow">L0 BOUNDARY</span>
      <h2>本页不知道现场发生了什么</h2>
      <p>所有步骤都只是通用核验建议。没有证据被输入，也不会生成候选评分。</p>
      <ul><li>不建立匿名对象</li><li>不记录“是/否”判断</li><li>不输出现场结论</li><li>关闭或刷新后回到初始状态</li></ul>
      ${state.permissions.toolDuringSession === 'no' ? '<div class="warning-note">开始远程控制前，请结束会话并关闭此页面。</div>' : ''}
    </aside>
  </div>`;
}

function objectCountCard(type, title, items, limit) {
  const canAdd = items.length < limit;
  return `<section class="object-group">
    <div class="object-group-head"><div><span>${type}</span><h3>${title}</h3></div><button type="button" data-add-object="${type}" ${canAdd ? '' : 'disabled'}>＋ 添加</button></div>
    <div class="object-chips">${items.map(item => `<span>${item.id}</span>`).join('')}</div>
    <small>${items.length} / ${limit} · 仅匿名编号</small>
  </section>`;
}

function optionsFor(items, selected) {
  return items.map(item => `<option value="${item.id}" ${item.id === selected ? 'selected' : ''}>${item.id}</option>`).join('');
}

function renderAnonymousMap() {
  const { products, services, nodes, relations } = state.objects;
  return `<div class="map-layout">
    <section class="panel anonymous-map-panel">
      <div class="panel-heading"><div><span class="section-index">A</span><h2>匿名关系图</h2></div><p>对应关系只保留在你的记忆或客户允许的介质中。</p></div>
      <div class="anonymous-flow">
        ${services.map((service, index) => {
          const nextService = services[index + 1];
          const hasForwardRelation = nextService && relations.some(relation => relation.source === service.id && relation.target === nextService.id);
          return `<div class="service-orb-wrap"><button class="service-orb${state.activeSubject === service.id ? ' active' : ''}" type="button" data-active-subject="${service.id}"><span>${service.id}</span><small>${service.productId} · ${service.nodeId}</small></button>${nextService ? `<i class="flow-line${hasForwardRelation ? '' : ' unconfirmed'}">${hasForwardRelation ? '→' : '···'}</i>` : ''}</div>`;
        }).join('')}
      </div>
      <div class="relations-list">
        <div class="relations-title"><b>已确认的调用或依赖方向</b><small>方向不确定时不要添加</small></div>
        ${relations.length ? relations.map((relation, index) => `<div class="relation-row"><span>${relation.source}</span><i>→</i><span>${relation.target}</span><button type="button" data-remove-relation="${index}" aria-label="移除关系">×</button></div>`).join('') : '<div class="empty-inline">尚未确认匿名关系</div>'}
        <form id="relationForm" class="relation-form">
          <select name="source" aria-label="关系起点">${optionsFor(services, services[0]?.id)}</select><span>→</span><select name="target" aria-label="关系终点">${optionsFor(services, services[1]?.id || services[0]?.id)}</select><button type="submit">添加关系</button>
        </form>
      </div>
    </section>
    <aside class="object-sidebar">
      ${objectCountCard('product', '匿名产品', products, 4)}
      ${objectCountCard('service', '匿名服务', services, 9)}
      ${objectCountCard('node', '匿名节点', nodes, 5)}
    </aside>
    <section class="panel assignment-panel">
      <div class="panel-heading"><div><span class="section-index">B</span><h2>匿名归属</h2></div><p>只选择编号，不录入真实名称。</p></div>
      <div class="assignment-grid">${services.map(service => `<div class="assignment-row"><b>${service.id}</b><label>所属产品<select data-assign-service="${service.id}" data-field="productId">${optionsFor(products, service.productId)}</select></label><label>所在节点<select data-assign-service="${service.id}" data-field="nodeId">${optionsFor(nodes, service.nodeId)}</select></label></div>`).join('')}</div>
    </section>
  </div>`;
}

function evidenceAnswer(subjectId, evidenceId) {
  return state.evidence[subjectId]?.[evidenceId] || 'unknown';
}

function renderEvidenceBoard() {
  const services = state.objects.services;
  const progress = evidenceProgress(services, state.evidence);
  if (!services.some(service => service.id === state.activeSubject)) state.activeSubject = services[0]?.id || '';
  return `<div class="evidence-layout">
    <section class="evidence-toolbar panel">
      <div><span class="eyebrow">当前核验对象</span><div class="subject-tabs">${services.map(service => `<button type="button" class="${service.id === state.activeSubject ? 'active' : ''}" data-active-subject="${service.id}">${service.id}</button>`).join('')}</div></div>
      <div class="evidence-progress"><b>${progress.percent}%</b><span>结构化判断已处理</span><small>${progress.answered} 项已确认/排除/无权限 · ${progress.forbidden} 项无权限</small></div>
    </section>
    <div class="evidence-columns">
      ${Object.entries(CATEGORY_META).map(([category, meta]) => {
        const definitions = EVIDENCE_DEFINITIONS.filter(item => item.category === category);
        return `<section class="evidence-category panel"><div class="category-head"><span class="category-dot ${meta.color}"></span><div><h2>${meta.label}</h2><small>类别最高 +${meta.cap} 分</small></div></div><div class="evidence-cards">${definitions.map(definition => {
          const answer = evidenceAnswer(state.activeSubject, definition.id);
          return `<article class="evidence-card"><div class="evidence-title"><div><h3>${definition.title}</h3><p>${definition.detail}</p></div><span>${definition.points > 0 ? `+${definition.points}` : '线索'}</span></div><div class="result-options">${RESULT_OPTIONS.map(option => `<button type="button" class="${answer === option.id ? `selected ${option.tone}` : ''}" data-evidence="${definition.id}" data-result="${option.id}">${option.label}</button>`).join('')}</div></article>`;
        }).join('')}</div></section>`;
      }).join('')}
    </div>
  </div>`;
}

function confidenceLabel(value) {
  return value === 'high' ? '高' : value === 'medium' ? '中' : '低';
}

function renderCandidate(candidate, index) {
  return `<article class="candidate-card confidence-${candidate.confidence}">
    <div class="candidate-rank"><span>TOP ${index + 1}</span><b>${candidate.subjectAlias}</b><small>匿名服务</small></div>
    <div class="candidate-score"><strong>${candidate.score}</strong><span>/ 100</span><em>${confidenceLabel(candidate.confidence)}可信</em></div>
    <div class="candidate-body">
      <div class="source-tags">${candidate.evidenceSources.map(source => `<span class="${CATEGORY_META[source].color}">${CATEGORY_META[source].label}</span>`).join('')}${candidate.propagation ? '<span class="muted">受下游影响线索</span>' : ''}</div>
      <div class="reason-list">${candidate.reasons.map(reason => `<div><span>+${reason.points}</span><p><b>${reason.title}</b><small>${reason.detail}</small></p></div>`).join('')}</div>
      ${candidate.incompleteTrace ? '<div class="candidate-warning">链路完整度不足，不能仅凭当前评分提高可信度。</div>' : ''}
    </div>
  </article>`;
}

function renderResults() {
  const candidates = scoreCandidates(state.objects.services, state.evidence);
  const top = candidates[0];
  const gaps = missingEvidence(top);
  const nextCategory = gaps[0];
  return `<div class="results-layout">
    <section class="results-main">
      <div class="results-heading"><div><span class="eyebrow">基于匿名人工判断</span><h2>可疑点排序</h2><p>星图没有读取原始数据；分数只用于安排下一步核验顺序。</p></div><span class="manual-badge">人工确认 · 非自动结论</span></div>
      ${candidates.length ? `<div class="candidate-list">${candidates.map(renderCandidate).join('')}</div>` : `<div class="empty-results"><span>◎</span><h3>还没有形成候选点</h3><p>正常对象不会为了凑满Top 3进入列表。请先在“证据棋盘”确认至少一项正向证据。</p><button type="button" class="primary-button" data-workspace-tab="evidence">去核验证据 <span>→</span></button></div>`}
    </section>
    <aside class="results-side">
      <section class="panel next-check"><span class="eyebrow">下一步最值得核验</span><h3>${nextCategory ? CATEGORY_META[nextCategory].label : '交叉复核'}</h3><p>${nextCategory ? CATEGORY_NEXT_CHECK[nextCategory] : '当前主要证据类型已覆盖，请回到原平台交叉复核最早失败点和直接上下游。'}</p><button type="button" data-workspace-tab="evidence">返回证据棋盘 →</button></section>
      <section class="panel evidence-gaps"><h3>关键证据缺口</h3>${gaps.length ? `<ul>${gaps.map(category => `<li><span class="category-dot ${CATEGORY_META[category].color}"></span>${CATEGORY_META[category].label}<b>未形成独立证据</b></li>`).join('')}</ul>` : '<div class="all-covered">五类证据均已有确认项</div>'}</section>
      <section class="disclaimer-card"><b>边界声明</b><p>本结果来自匿名人工选择，不包含现场原始证据，不代表已经完成事实复核。</p></section>
    </aside>
  </div>`;
}

function renderL1Workspace() {
  const tabs = [
    ['map', '匿名链路'],
    ['evidence', '证据棋盘'],
    ['results', '定界结果']
  ];
  const content = state.workspaceTab === 'map' ? renderAnonymousMap() : state.workspaceTab === 'evidence' ? renderEvidenceBoard() : renderResults();
  return `<div class="workspace-tabs">${tabs.map(([id, label], index) => `<button type="button" data-workspace-tab="${id}" class="${state.workspaceTab === id ? 'active' : ''}"><span>0${index + 1}</span>${label}${id === 'results' ? `<i>${scoreCandidates(state.objects.services, state.evidence).length}</i>` : ''}</button>`).join('')}</div>${content}`;
}

function renderWorkspace() {
  const symptom = currentSymptom();
  return `<main class="page workspace-page">
    <div class="workspace-heading">
      <div><button class="back-link" type="button" data-back-symptom>← 更换症状</button><span class="symptom-mini">${symptom.icon}</span><div><small>当前症状</small><h1>${symptom.title}</h1></div></div>
      <div class="workspace-actions">${state.mode === 'L1' ? '<button class="secondary-button" type="button" data-switch-l0>切换为L0零数据</button>' : ''}<span>${currentMode().description}</span></div>
    </div>
    ${state.mode === 'L0' ? renderL0Workspace() : renderL1Workspace()}
  </main>`;
}

function renderModal() {
  if (!state.modal) return '';
  if (state.modal === 'end') return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="endTitle"><span class="modal-icon">×</span><h2 id="endTitle">结束并清空本次会话？</h2><p>匿名对象、判断项和可疑点将立即从页面内存中清除，无法恢复。</p><div><button class="secondary-button" type="button" data-close-modal>继续排障</button><button class="danger-button" type="button" data-confirm-end>清空并结束</button></div></section></div>`;
  if (state.modal === 'switch-l0') return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="switchTitle"><span class="modal-icon safe">L0</span><h2 id="switchTitle">切换到零数据模式？</h2><p>所有匿名对象和证据判断都会清空，只保留当前症状的通用排障路线。</p><div><button class="secondary-button" type="button" data-close-modal>取消</button><button class="primary-button" type="button" data-confirm-l0>清空并切换</button></div></section></div>`;
  return '';
}

function render() {
  const content = state.stage === 'preflight' ? renderPreflight() : state.stage === 'symptom' ? renderSymptom() : renderWorkspace();
  app.innerHTML = `${renderHeader()}${renderSecurityStrip()}${renderStepRail()}${content}<footer><span>星图保密现场模式</span><p>不连接 · 不采集 · 不持久化 · 不替代客户审批</p></footer>${renderModal()}`;
}

function addObject(type) {
  if (type === 'product' && state.objects.products.length < 4) {
    state.objects.products.push({ id: `P${state.objects.products.length + 1}` });
  }
  if (type === 'node' && state.objects.nodes.length < 5) {
    state.objects.nodes.push({ id: `N${state.objects.nodes.length + 1}` });
  }
  if (type === 'service' && state.objects.services.length < 9) {
    const id = `S${state.objects.services.length + 1}`;
    state.objects.services.push({ id, productId: state.objects.products[0].id, nodeId: state.objects.nodes[0].id });
    state.activeSubject = id;
  }
  render();
}

app.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;

  if (button.dataset.permission) {
    state.permissions[button.dataset.permission] = button.dataset.value;
    return render();
  }
  if (button.hasAttribute('data-confirm-preflight') && permissionReady()) {
    state.mode = deriveMode(state.permissions).id;
    state.stage = 'symptom';
    return render();
  }
  if (button.dataset.symptom) {
    state.symptomId = button.dataset.symptom;
    state.stage = 'workspace';
    state.workspaceTab = state.mode === 'L1' ? 'map' : 'guide';
    state.guideIndex = 0;
    return render();
  }
  if (button.hasAttribute('data-reset-session')) {
    state = freshState();
    return render();
  }
  if (button.hasAttribute('data-back-symptom')) {
    state.stage = 'symptom';
    state.symptomId = '';
    state.objects = createInitialObjects();
    state.evidence = {};
    state.activeSubject = 'S1';
    return render();
  }
  if (button.dataset.workspaceTab) {
    state.workspaceTab = button.dataset.workspaceTab;
    return render();
  }
  if (button.dataset.addObject) return addObject(button.dataset.addObject);
  if (button.dataset.activeSubject) {
    state.activeSubject = button.dataset.activeSubject;
    if (state.workspaceTab === 'map' && button.classList.contains('service-orb')) state.workspaceTab = 'evidence';
    return render();
  }
  if (button.dataset.removeRelation !== undefined) {
    state.objects.relations.splice(Number(button.dataset.removeRelation), 1);
    return render();
  }
  if (button.dataset.evidence) {
    if (!state.evidence[state.activeSubject]) state.evidence[state.activeSubject] = {};
    state.evidence[state.activeSubject][button.dataset.evidence] = button.dataset.result;
    return render();
  }
  if (button.hasAttribute('data-guide-next')) {
    state.guideIndex += 1;
    return render();
  }
  if (button.hasAttribute('data-guide-prev')) {
    state.guideIndex = Math.max(0, state.guideIndex - 1);
    return render();
  }
  if (button.hasAttribute('data-open-end')) {
    state.modal = 'end';
    return render();
  }
  if (button.hasAttribute('data-switch-l0')) {
    state.modal = 'switch-l0';
    return render();
  }
  if (button.hasAttribute('data-close-modal')) {
    state.modal = null;
    return render();
  }
  if (button.hasAttribute('data-confirm-end')) {
    state = freshState();
    return render();
  }
  if (button.hasAttribute('data-confirm-l0')) {
    state.mode = 'L0';
    state.objects = createInitialObjects();
    state.evidence = {};
    state.activeSubject = 'S1';
    state.guideIndex = 0;
    state.modal = null;
    return render();
  }
});

app.addEventListener('change', event => {
  const select = event.target.closest('select[data-assign-service]');
  if (!select) return;
  const service = state.objects.services.find(item => item.id === select.dataset.assignService);
  if (!service || !['productId', 'nodeId'].includes(select.dataset.field)) return;
  service[select.dataset.field] = select.value;
  render();
});

app.addEventListener('submit', event => {
  if (event.target.id !== 'relationForm') return;
  event.preventDefault();
  const data = new FormData(event.target);
  const source = String(data.get('source') || '');
  const target = String(data.get('target') || '');
  const serviceIds = new Set(state.objects.services.map(service => service.id));
  if (!serviceIds.has(source) || !serviceIds.has(target) || source === target) return;
  if (!state.objects.relations.some(relation => relation.source === source && relation.target === target)) state.objects.relations.push({ source, target });
  render();
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !state.modal) return;
  state.modal = null;
  render();
});

render();

window.XINGTU_CONFIDENTIAL = {
  version: '1.0.0',
  get stage() { return state.stage; },
  get mode() { return state.mode; }
};
</script>
</body>
</html>
