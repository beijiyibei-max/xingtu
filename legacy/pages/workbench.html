</style></head><body><div id="app"></div><script>const CATALOG=[{"id":"redis-ha","name":"Redis 高可用（哨兵）","category":"存储","group":"dtstack","brief":"1 主 2 从 + 3 哨兵，故障自动切换","deps":["*/redis-replication*/3","*/redis-sentinel*/3","*/redis-operator/1"],"wires":["global.redis.sentinel=true"],"params":[{"source":"common-config.yaml / global.redis","key":"sentinel","expect":"true","type":"布尔","desc":"false 表示业务走单实例"},{"source":"common-config.yaml / global.redis","key":"sentinelHost","expect":"redis-sentinel-sentinel:26379","type":"地址","desc":"sentinel=true 时必须填"},{"source":"common-config.yaml / global.redis","key":"host","expect":"redis-sentinel-sentinel","type":"服务名","desc":"切哨兵后 host 也要指过去"}],"apply":["EM → 组件管理 → 公共配置 → global 段，改 redis.sentinel 等 3 个键","保存后重部署依赖 redis 的组件（见影响面）","!! 不要直接 kubectl edit cm：EM 每次保存配置都会重渲染并覆盖手改"],"verify":[{"cmd":"kubectl get pod -A -o name | grep -c redis-sentinel","expect":"3"},{"cmd":"kubectl get pod -A -o name | grep -c redis-standalone","expect":"0"},{"cmd":"kubectl exec \u003c指名Pod> -n \u003cns> -- sh -c 'grep -ri sentinel /opt/dtstack/*/conf/*.properties'","expect":"sentinel"}],"impact":"dtuic publicservice batch stream api assets","fallback":"把 3 个键改回 false / 空 / redis-standalone-master，再重部署一次","note":"切换瞬间缓存失效；database 编号必须与单实例一致","source":"现场台账 C-12 · 痛点总结 §3.2","verifiedAt":null,"confidence":"pending"},{"id":"redis-single","name":"Redis 单实例","category":"存储","group":"dtstack","brief":"单点，节点或进程异常即不可用","deps":["*/redis-standalone*/1"],"wires":["global.redis.sentinel=false"],"params":[{"source":"common-config.yaml / global.redis","key":"sentinel","expect":"false","type":"布尔","desc":"true = 走哨兵高可用"},{"source":"common-config.yaml / global.redis","key":"host","expect":"redis-standalone-master","type":"服务名","desc":"必须与真实 Service 名完全一致"},{"source":"common-config.yaml / global.redis","key":"port","expect":"6379","type":"端口","desc":"随主机端口矩阵核对"}],"apply":["保持现状即可；若从哨兵回退，把上面 3 个键改回这组值","!! 回退后缓存里可能残留哨兵写入的数据，必要时重建"],"verify":[{"cmd":"kubectl get pod -A -o wide | grep redis-standalone","expect":"1/1"}],"impact":"dtuic publicservice batch stream api assets","fallback":"改回哨兵三键并重部署","note":"单点：节点宕机 / 磁盘满 / 进程异常都会直接停服","source":"现场台账 C-12 · 痛点总结 §3.2","verifiedAt":null,"confidence":"pending"},{"id":"platform-ha","name":"平台高可用副本（replicaHighCount）","category":"平台","group":"dtstack","brief":"配置里声明的副本数，运行时应与之一致","deps":[],"wires":["global.replicaHighCount>=2"],"params":[{"source":"common-config.yaml / global","key":"replicaHighCount","expect":"2","type":"枚举","desc":"有状态组件的期望副本数"}],"apply":["EM → 公共配置 → global 段改 replicaHighCount","!! 改完必须重部署有状态组件，否则只是改了个数字（配置声明 ≠ 运行时副本）","!! 副本数受节点标签与反亲和约束，节点不够会 Pending"],"verify":[{"cmd":"kubectl get sts -A -o custom-columns=N:.metadata.name,R:.status.readyReplicas,D:.spec.replicas","expect":"每个 sts 的 ready 应等于 replicaHighCount"}],"impact":"kafka zookeeper nacos mysql postgresql redis es","fallback":"改回 1 并重部署","note":"这是最容易被忽略的一条：配置说 2、实际跑 1，等于没有高可用","source":"现场实测 2026-10-30","drift":"replica","verifiedAt":null,"confidence":"pending"},{"id":"ai-capability","name":"AI / 多模态能力","category":"平台","group":"dtstack","brief":"开关关闭时组件仍在跑，但门户不出现入口","deps":["*/aiworks*/1"],"wires":["global.ai_switch=true","global.feature.ai=true"],"params":[{"source":"common-config.yaml / global","key":"ai_switch","expect":"true","type":"布尔","desc":"平台级总开关"},{"source":"common-config.yaml / global.feature","key":"ai","expect":"true","type":"布尔","desc":"功能开关，与 ai_switch 分开"},{"source":"common-config.yaml / global.feature","key":"stream","expect":"true","type":"布尔","desc":"实时开发入口"},{"source":"common-config.yaml / global.feature","key":"ide","expect":"true","type":"布尔","desc":"离线开发入口"}],"apply":["EM → 公共配置 → global 段改 ai_switch / feature.ai","各模块的 feature.* 开关在同一个 global.feature 段里，别只改 ai_switch","!! 开关开启 ≠ 组件已安装；先确认 aiworks / kuberay / uniparse 都在"],"verify":[{"cmd":"kubectl exec \u003c指名Pod> -n \u003cns> -- sh -c 'env | grep -i ai_switch'","expect":"ai_switch"}],"impact":"aiworks aiworksfront kuberay-operato   function recheckFact(p,fid,{value,reference,checkedAt}) {

  function rebuild(p,reason) {

  function validTime(value){return typeof value==='string'&&Number.isFinite(Date.parse(value))&&Date.parse(value)<=Date.now()+300000;}
  function resource(kind,value){
    if(typeof value!=='string')return null;const text=value.trim();

  function evaluate(p,change) {

    if(change.epoch!==p.epoch)return {status:'stale',rows:[],gaps:['环境已重建，旧代次验收不可沿用']};

  function validate(value){

    if(!['L1','L2'].includes(value.policy)||!Number.isInteger(value.epoch)||value.epoch<1)throw Error('项目模式或环境代次无效');
    for(const key of ['id','projectId','clusterId','namespace','phase','createdAt','updatedAt'])if(typeof value[key]!=='string'||!value[key].trim()||value[key].length>200)throw Error('项目字段无效：'+key);
    for(const key of ['facts','cases','changes','events'])if(!Array.isArray(value[key])||value[key].length>1000)throw Error('项目记录过多或格式无效');

      for(const check of c.checks)if(!check||typeof check.id!=='string'||!Array.isArray(check.choices)||check.choices.some(x=>typeof x!=='string'))throw Error('检查项无效');
      for(const j of c.judgments)if(!j||typeof j.text!=='string'||!['pending','rejected','operator-confirmed'].includes(j.status)||!Array.isArray(j.history)||j.history.some(h=>!h||typeof h.status!=='string'))throw Error('判断记录无效');

  const p=W.project;
  let content='';
  if(W.modal==='save'||W.modal==='open')content=`<h2>${W.modal==='save'?'保存加密项目文件':'打开加密项目文件'}</h2><p class="dim">保护口令不会写进文件或浏览器存储。请自行妥善保管，丢失后无法恢复。</p><div class="field"><label for="project-password">项目保护口令（至少 10 个字符）</label><input id="project-password" type="password" autocomplete="off" minlength="10"></div>${W.modal==='save'?'<div class="field"><label for="project-password-repeat">再输入一次</label><input id="project-password-repeat" type="password" autocomplete="off"></div>':''}<button class="primary" id="password-submit">${W.modal==='save'?'加密并下载':'解密并打开'}</button>`;
  if(W.modal==='new')content=`<h2>新建项目</h2><p class="dim">L1 使用固定代号和固定选项；L2 允许保存经批准的运维标识和证据定位。</p><div class="field"><label for="new-policy">现场模式</label><select id="new-policy"><option value="L1">L1 保密固定选项</option><option value="L2">L2 本机项目档案</option></select></div><div id="new-identities"><div class="field"><label for="new-project">项目代号</label><select id="new-project">${Array.from({length:10},(_,i)=>`<option>project-${String(i+1).padStart(2,'0')}</option>`).join('')}</select></div><div class="field"><label for="new-cluster">集群代号</label><select id="new-cluster"><option>cluster-01</option><option>cluster-02</option><option>cluster-03</option></select></div><div class="field"><label for="new-namespace">命名空间</label><select id="new-namespace"><option>dtstack</option><option>easymanager</option><option>aiworks</option></select></div></div><button class="primary" id="new-submit">建立空白项目</button>`;
  if(W.modal==='fact')content=renderFactModal(p);
  if(W.modal==='rebuild')content=`<h2>登记环境重建</h2><p>旧运行态证据将失效；持久数据转为待回查；所有旧问题保留为历史，不直接用于当前操作。</p><div class="field"><label for="rebuild-reason">登记原因</label><select id="rebuild-reason"><option>集群已重建，重新取证</option><option>环境迁移，重新核对落点</option><option>恢复后建立新的环境代次</option></select></div><button class="primary" id="rebuild-submit">确认登记新代次</button>`;
  if(W.modal==='reject')content=`<h2>记录反证并作废判断</h2><div class="field"><label for="reject-reason">作废原因</label><select id="reject-reason"><option>出现反例，原解释不成立</option><option>当前实例证据不支持此判断</option><option>原判断来自过期环境</option><option>其他解释得到更直接的证据支持</option></select></div>${referenceField('reject-ref')}<button class="primary" id="reject-submit">保留原文并标记作废</button>`;
  if(W.modal==='confirm'){const c=selectedIssue();content=`<h2>关联证据，记录人员判断</h2><p class="dim">只表示人员据此作出判断，不自动证明因果。无权限或对象已回收不能作为有效支持证据。</p><div class="field"><label for="confirm-evidence">支持证据</label><select id="confirm-evidence">${c.evidence.map(e=>`<option value="${e.id}">${E(e.value)} · ${E(e.reference)}</option>`).join('')}</select></div><button class="primary" id="confirm-submit">关联当前证据</button>`;}
  if(W.modal==='target')content=`<h2>冻结 AIWorks 变更目标</h2><p class="dim">应来自批准物料；冻结后不可直接改写，目标变化时建立新记录。</p><div class="split">${Object.entries(XTProject.FIELD_LABELS).map(([key,label])=>inputField('target-'+key,label,'',key.includes('Digest')?'sha256: 加 64 位十六进制':'批准的目标值')).join('')}</div>${inputField('target-ref','批准物料 / 变更单定位')}${inputField('baseline-backend','变更前后端镜像（可暂缺）')}${inputField('baseline-front','变更前前端镜像（可暂缺）')}<button class="primary" id="target-submit">冻结目标并开始记录</button>`;
  return `<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true"><div class="heading"><span class="eyebrow">本机项目操作</span><button id="modal-close">关闭</button></div>${content}${S.error?`<div class="notice bad" role="alert">${E(S.error)}</div>`:''}</section></div>`;
}
function downloadProjectFile(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function uiValue(id){return document.getElementById(id)?.value?.trim()||'';}
function isoTime(id){const value=uiValue(id);if(!value)return '';const time=new Date(value);return Number.isFinite(time.getTime())?time.toISOString():'';}
function bindWorkbench(){
  const on=(id,fn)=>{const element=document.getElementById(id);if(element)element.onclick=async()=>{try{S.error='';await fn();}catch(error){S.error=error.message;}render();};};
  const replaceAllowed=()=>!W.dirty||window.confirm('当前内存中有未保存更新。继续将替换它；如需保留，请取消并先保存项目。');
  document.querySelectorAll('[data-workbench-page]').forEach(button=>button.onclick=()=>{S.page=button.dataset.workbenchPage;render();});
  on('project-demo',()=>{if(!replaceAllowed())return;const p=XTProject.demo();p.policy='L2';W.project=p;W.dirty=false;W.caseId=p.cases[0].id;W.changeId=p.changes[0].id;W.notice='已载入合成字段与脱敏历史摘要。';});
  on('project-new',()=>{W.modal='new';});on('project-save',()=>{if(!crypto.subtle)throw Error('当前连接不支持项目加密，请使用离线 HTML、localhost 或 HTTPS 打开');W.modal='save';});
  const opener=document.getElementById('project-open');if(opener)opener.onclick=()=>document.getElementById('project-file').click();
  on('project-handover',()=>{downloadProjectFile('xingtu-handover.txt',XTProject.handover(W.project),'text/plain;charset=utf-8');W.notice='已生成续接摘要；这是明文摘要，外发前请审阅。';});
  on('add-fact',()=>{W.factId=null;W.modal='fact';});on('project-rebuild',()=>{W.modal='rebuild';});
  document.querySelectorAll('[data-recheck]').forEach(button=>button.onclick=()=>{W.factId=button.dataset.recheck;W.modal='fact';render();});
  on('modal-close',()=>{W.modal=null;W.envelope=null;S.error='';});
  document.querySelectorAll('[data-phase]').forEach(button=>button.onclick=()=>{const p=structuredClone(W.project);p.phase=button.dataset.phase;p.updatedAt=new Date().toISOString();p.events.push({id:crypto.randomUUID(),at:p.updatedAt,epoch:p.epoch,type:'phase-updated',summary:'阶段更新：'+p.phase});commitProject(p);render();});
  on('new-submit',()=>{if(!replaceAllowed())return;const next=XTProject.create({projectId:uiValue('new-project'),clusterId:uiValue('new-cluster'),namespace:uiValue('new-namespace'),policy:uiValue('new-policy')});W.project=XTProject.validate(next);W.dirty=true;W.modal=null;W.caseId=null;W.changeId=null;W.notice='已建立空白项目。';});
  const policy=document.getElementById('new-policy');if(policy)policy.onchange=()=>{document.getElementById('new-identities').innerHTML=policy.value==='L2'?inputField('new-project','匿名项目代号','project-01')+inputField('new-cluster','集群代号','cluster-01')+inputField('new-namespace','命名空间','dtstack'):`<div class="field"><label for="new-project">项目代号</label><select id="new-project"><option>project-01</option><option>project-02</option><option>project-03</option></select></div><div class="field"><label for="new-cluster">集群代号</label><select id="new-cluster"><option>cluster-01</option><option>cluster-02</option></select></div><div class="field"><label for="new-namespace">命名空间</label><select id="new-namespace"><option>dtstack</option><option>easymanager</option><option>aiworks</option></select></div>`;};
  on('fact-submit',()=>{const data={label:uiValue('fact-label'),value:uiValue('fact-value'),scope:uiValue('fact-scope'),reference:uiValue('fact-ref'),checkedAt:isoTime('fact-time')};commitProject(W.factId?XTProject.recheckFact(W.project,W.factId,data):XTProject.addFact(W.project,data));W.modal=null;W.factId=null;});
  on('rebuild-submit',()=>{commitProject(XTProject.rebuild(W.project,uiValue('rebuild-reason')));W.modal=null;});
  on('case-add',()=>{commitProject(XTProject.addCase(W.project,uiValue('case-template')));W.caseId=W.project.cases.at(-1).id;W.checkId=null;});
  document.querySelectorAll('[data-issue]').forEach(button=>button.onclick=()=>{W.caseId=button.dataset.issue;W.checkId=null;render();});
  const check=document.getElementById('case-check');if(check)check.onchange=()=>{W.checkId=check.value;render();};
  on('case-record',()=>{commitProject(XTProject.evidence(W.project,selectedIssue().id,{checkId:uiValue('case-check'),value:uiValue('case-result'),reference:uiValue('case-ref'),checkedAt:isoTime('case-time')}));W.checkId=null;});
  on('case-close',()=>{commitProject(XTProject.closeCase(W.project,selectedIssue().id));});
  document.querySelectorAll('[data-reject]').forEach(button=>button.onclick=()=>{W.judgmentId=button.dataset.reject;W.modal='reject';render();});
  document.querySelectorAll('[data-confirm]').forEach(button=>button.onclick=()=>{W.judgmentId=button.dataset.confirm;W.modal='confirm';render();});
  on('reject-submit',()=>{commitProject(XTProject.reject(W.project,selectedIssue().id,W.judgmentId,uiValue('reject-reason'),uiValue('reject-ref')));W.modal=null;});
  on('confirm-submit',()=>{commitProject(XTProject.confirm(W.project,selectedIssue().id,W.judgmentId,uiValue('confirm-evidence')));W.modal=null;});
  on('change-new',()=>{W.modal='target';});
  const change=document.getElementById('change-select');if(change)change.onchange=()=>{W.changeId=change.value;render();};
  on('target-submit',()=>{const target={reference:uiValue('target-ref')};Object.keys(XTProject.FIELD_LABELS).forEach(key=>target[key]=uiValue('target-'+key));commitProject(XTProject.newAcceptance(W.project,target,{backendImage:uiValue('baseline-backend'),frontendImage:uiValue('baseline-front')}));W.changeId=W.project.changes.at(-1).id;W.modal=null;});
  document.querySelectorAll('[data-layer]').forEach(button=>button.onclick=()=>{W.layer=button.dataset.layer;render();});
  on('layer-save',()=>{const layer=W.layer||'declaration',data={reference:uiValue('layer-ref'),checkedAt:isoTime('layer-time')};const keys=layer==='business'?['status','sampleId','summary']:['backendImage','frontendImage','cpu','memory',...(layer==='template'?['strategy']:[]),...(layer==='runtime'?['backendDigest','frontendDigest','podUID','frontendPodUID']:[])];keys.forEach(key=>data[key]=uiValue('layer-'+key));commitProject(XTProject.saveLayer(W.project,selectedChange().id,layer,data));});
  const fill=(layer,old=false)=>{const c=selectedChange(),target=c.target;let data={...target,reference:'脱敏合成证据：'+layer,checkedAt:new Date().toISOString()};delete data.reference;data.reference='脱敏合成证据：'+layer;
    if(layer==='template')data.strategy='OnDelete';
    if(layer==='runtime'){data.podUID='demo-backend-uid';data.frontendPodUID='demo-frontend-uid';if(old){data.backendImage='example.invalid/aiworks:new';data.backendDigest='sha256:'+'c'.repeat(64);}}
    if(layer==='business')data={status:'pass',sampleId:'demo-sample-001',summary:'演示：门户可用，固定小样本输出 1 项且内容非空',reference:'脱敏合成证据：业务结果',checkedAt:new Date().toISOString()};
    commitProject(XTProject.saveLayer(W.project,c.id,layer,data));};
  for(const layer of ['declaration','template','runtime','business'])on('fill-layer-'+layer,()=>fill(layer));on('fill-layer-old',()=>fill('runtime',true));
  on('password-submit',async()=>{const password=document.getElementById('project-password').value;if(password.length<10)throw Error('保护口令至少 10 个字符');
    const button=document.getElementById('password-submit');button.disabled=true;
    try{if(W.modal==='save'){if(password!==document.getElementById('project-password-repeat').value)throw Error('两次保护口令不一致');const envelope=await XTProject.encrypt(W.project,password);downloadProjectFile('xingtu-project.xtproject',JSON.stringify(envelope));W.dirty=false;W.notice='已生成加密下载。请保留文件与保护口令，稍后可重新打开续接。';}
      else {const project=await XTProject.decrypt(W.envelope,password);if(!replaceAllowed())return;W.project=project;W.caseId=null;W.changeId=null;W.dirty=false;W.notice='已恢复项目档案；请先核对实际环境代次。';}
      W.modal=null;W.envelope=null;
    }finally{const input=document.getElementById('project-password');if(input)input.value='';const repeat=document.getElementById('project-password-repeat');if(repeat)repeat.value='';button.disabled=false;}});
  const file=document.getElementById('project-file');if(file)file.onchange=async event=>{try{S.error='';const selected=event.target.files[0];if(!selected)return;if(selected.size>1024*1024)throw Error('项目文件超过 1MB');const envelope=JSON.parse(await selected.text());if(envelope.kind!=='xingtu-encrypted-project')throw Error('请选择加密的 .xtproject 文件，不接收原始聊天或日志');W.envelope=envelope;W.modal='open';}catch(error){S.error=error.message;}render();};
}

render();</script></body></html>
