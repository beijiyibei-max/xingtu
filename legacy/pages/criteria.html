<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'; font-src data:; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; worker-src 'none'; media-src 'none'">
  <title>星图 · 现场排障与部署判据台</title>
  <style>:root {
  color-scheme: dark;
  --bg: #071019;
  --surface: #0d1924;
  --surface-2: #111f2c;
  --line: rgba(151, 185, 213, .16);
  --line-strong: rgba(151, 185, 213, .3);
  --text: #edf6fb;
  --muted: #8fa9ba;
  --cyan: #6ce5ff;
  --mint: #65f5ad;
  --amber: #ffbf69;
  --red: #ff738b;
  --blue: #88a8ff;
  --purple: #d5a4ff;
  --radius: 14px;
  --shadow: 0 18px 60px rgba(0, 0, 0, .24);
  font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-width: 320px; color: var(--text); background:
  radial-gradient(circle at 12% -10%, rgba(35, 130, 165, .2), transparent 34rem),
  radial-gradient(circle at 95% 18%, rgba(101, 245, 173, .08), transparent 27rem), var(--bg); }
button, select { font: inherit; }
button { color: inherit; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 10px; font-size: clamp(28px, 4vw, 48px); line-height: 1.08; letter-spacing: -.04em; }
h2 { margin-bottom: 8px; font-size: 22px; }
h3 { margin-bottom: 7px; font-size: 15px; }
p { color: var(--muted); line-height: 1.65; }
small { color: var(--muted); }
code { font-family: Consolas, "SFMono-Regular", monospace; }

.topbar { position: sticky; top: 0; z-index: 20; min-height: 72px; display: grid; grid-template-columns: 250px 1fr 140px; align-items: center; gap: 20px; padding: 0 32px; background: rgba(7, 16, 25, .9); border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); }
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid rgba(108, 229, 255, .55); border-radius: 10px; color: var(--cyan); background: rgba(108, 229, 255, .08); font-weight: 800; box-shadow: inset 0 0 20px rgba(108, 229, 255, .08); }
.brand strong, .brand small { display: block; }
.brand strong { letter-spacing: .15em; }
.brand small { margin-top: 2px; font-size: 11px; }
.nav { justify-self: center; display: flex; align-self: stretch; }
.nav-item { position: relative; min-width: 148px; padding: 0 20px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.nav-item em { margin-right: 9px; color: #527083; font-size: 11px; font-style: normal; }
.nav-item:hover { color: var(--text); }
.nav-item.active { color: var(--text); }
.nav-item.active::after { position: absolute; content: ""; left: 22px; right: 22px; bottom: -1px; height: 2px; background: var(--cyan); box-shadow: 0 0 15px rgba(108, 229, 255, .8); }
.nav-item.active em { color: var(--cyan); }
.offline { justify-self: end; display: flex; align-items: center; gap: 8px; color: var(--mint); font-size: 12px; }
.offline span { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px var(--mint); }

main { width: min(1540px, calc(100% - 48px)); margin: 0 auto; padding: 34px 0 72px; }
footer { display: flex; justify-content: space-between; gap: 25px; padding: 20px 32px 30px; border-top: 1px solid var(--line); color: #668092; font-size: 12px; }
.hero { position: relative; display: flex; justify-content: space-between; align-items: end; gap: 40px; min-height: 220px; padding: 40px; margin-bottom: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(120deg, rgba(17, 36, 50, .96), rgba(8, 22, 32, .88)); box-shadow: var(--shadow); }
.hero::before { position: absolute; content: ""; inset: 0; opacity: .22; pointer-events: none; background-image: linear-gradient(rgba(108,229,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(108,229,255,.12) 1px, transparent 1px); background-size: 46px 46px; mask-image: linear-gradient(90deg, transparent, #000); }
.hero > * { position: relative; z-index: 1; }
.hero > div:first-child { max-width: 780px; }
.hero p:last-child { margin-bottom: 0; }
.hero.compact { min-height: 184px; }
.eyebrow { margin-bottom: 9px; color: var(--cyan); font: 700 11px/1.2 Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
.hero-stat { display: grid; grid-template-columns: auto auto; align-items: baseline; gap: 5px 10px; min-width: 190px; }
.hero-stat strong { color: var(--cyan); font: 300 42px/1 Consolas, monospace; }
.hero-stat span { color: var(--muted); font-size: 12px; }
.security-strip { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
.security-strip span { padding: 8px 12px; border: 1px solid rgba(101,245,173,.2); border-radius: 999px; color: #a9ddc3; background: rgba(101,245,173,.06); font-size: 12px; }
.preflight-input-panel, .preflight-issues, .material-panel, .checklist-panel { padding: 24px; }
.mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.mode-card { display: grid; grid-template-columns: 18px 1fr; gap: 10px; min-height: 90px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; color: inherit; background: #09151f; text-align: left; cursor: pointer; }
.mode-card > span { width: 13px; height: 13px; margin-top: 2px; border: 1px solid #5f7889; border-radius: 50%; }
.mode-card strong, .mode-card small { display: block; }
.mode-card small { margin-top: 7px; line-height: 1.5; }
.mode-card.active { border-color: rgba(108,229,255,.48); background: rgba(108,229,255,.06); }
.mode-card.active > span { border: 4px solid var(--cyan); }
.drop-zone { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 18px; min-height: 160px; padding: 25px; border: 1px dashed rgba(108,229,255,.38); border-radius: 13px; background: linear-gradient(110deg, rgba(108,229,255,.035), rgba(101,245,173,.025)); transition: .2s ease; }
.drop-zone.dragging { border-color: var(--mint); transform: translateY(-2px); background: rgba(101,245,173,.07); }
.drop-zone.busy { opacity: .65; pointer-events: none; }
.drop-icon { display: grid; place-items: center; width: 58px; height: 58px; border: 1px solid rgba(108,229,255,.28); border-radius: 15px; color: var(--cyan); background: #09151f; font-size: 28px; }
.drop-zone h3 { margin-bottom: 5px; font-size: 17px; }
.drop-zone p { margin-bottom: 0; font-size: 11px; }
.drop-actions { display: flex; flex-direction: column; gap: 8px; min-width: 116px; }
.primary-button, .ghost-button { display: inline-flex; justify-content: center; align-items: center; padding: 9px 13px; border: 1px solid rgba(108,229,255,.38); border-radius: 7px; color: #05131b; background: var(--cyan); font-size: 11px; font-weight: 700; cursor: pointer; }
.ghost-button { color: var(--cyan); background: transparent; }
.primary-button input, .ghost-button input { position: fixed; left: -10000px; width: 1px; height: 1px; opacity: 0; }
.primary-button.standalone { color: #05131b; }
.privacy-note { display: flex; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 10px; }
.privacy-note strong { color: var(--mint); }
.preflight-placeholder { display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 250px; margin-top: 18px; border: 1px dashed var(--line-strong); border-radius: 14px; color: var(--muted); }
.preflight-placeholder > span { color: #385468; font: 42px Consolas, monospace; }
.preflight-placeholder h2 { margin-bottom: 6px; color: #a9bdc9; }
.preflight-placeholder p { margin-bottom: 0; }
.result-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin: 18px 0; }
.summary-card { position: relative; padding: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: rgba(13,25,36,.92); }
.summary-card::before { position: absolute; content: ""; inset: 0 auto 0 0; width: 2px; background: var(--muted); }
.summary-card.blocker::before { background: var(--red); }
.summary-card.warning::before { background: var(--amber); }
.summary-card.notice::before { background: var(--cyan); }
.summary-card span, .summary-card strong, .summary-card small { display: block; }
.summary-card span { color: #667f90; font: 9px Consolas, monospace; letter-spacing: .12em; }
.summary-card strong { margin: 7px 0 2px; font: 30px Consolas, monospace; }
.summary-card.blocker strong { color: var(--red); }
.summary-card.warning strong { color: var(--amber); }
.summary-card.notice strong { color: var(--cyan); }
.preflight-issues, .material-panel, .checklist-panel { margin-top: 18px; }
.issue-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 13px; }
.issue-toolbar button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: #09151f; cursor: pointer; font-size: 10px; }
.issue-toolbar button b { margin-left: 4px; color: var(--text); }
.issue-toolbar button.active { border-color: var(--cyan); color: var(--cyan); background: rgba(108,229,255,.06); }
.issue-toolbar > span { margin-left: auto; color: #607b8c; font-size: 10px; }
.issue-list { display: grid; gap: 8px; }
.issue-card { display: grid; grid-template-columns: 42px 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-left: 2px solid var(--muted); border-radius: 8px; background: #09151f; }
.issue-card.blocker { border-left-color: var(--red); }
.issue-card.warning { border-left-color: var(--amber); }
.issue-card.notice { border-left-color: var(--cyan); }
.issue-index { color: #526c7e; font: 13px Consolas, monospace; }
.issue-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.issue-meta > span { color: #627c8e; font: 9px Consolas, monospace; overflow-wrap: anywhere; }
.issue-card h3 { font-size: 14px; }
.issue-card p { margin-bottom: 7px; font-size: 11px; }
.issue-card small { color: #94adba; line-height: 1.5; }
.issue-card small b { color: var(--mint); }
.badge.blocker { color: var(--red); border-color: rgba(255,115,139,.28); background: rgba(255,115,139,.06); }
.material-columns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.material-columns > div { min-width: 0; }
.material-list { display: grid; gap: 5px; max-height: 420px; overflow: auto; }
.material-list article { display: grid; grid-template-columns: minmax(150px, 1fr) auto minmax(160px, .8fr); align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: #09151f; }
.material-list strong, .material-list small { display: block; }
.material-list > article > small { overflow: hidden; color: #607889; font: 9px Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
.status-found, .status-verify { color: var(--mint); font-size: 10px; }
.status-missing { color: var(--red); font-size: 10px; }
.checklist-table { min-width: 820px; }
.checklist-panel { overflow-x: auto; }
.checklist-head, .checklist-row { display: grid; grid-template-columns: 55px minmax(150px, .8fr) 75px minmax(180px, 1fr) minmax(260px, 1.4fr); align-items: center; gap: 12px; }
.checklist-head { padding: 0 12px 9px; color: #637d8e; font-size: 9px; }
.checklist-row { min-height: 65px; padding: 10px 12px; border-top: 1px solid var(--line); }
.checklist-row > span:first-child { color: var(--cyan); font: 12px Consolas, monospace; }
.checklist-row strong, .checklist-row small { display: block; }
.checklist-row > div:nth-child(4) { display: flex; flex-wrap: wrap; gap: 4px; }
.checklist-row > div:nth-child(4) small { padding: 3px 5px; border-radius: 4px; background: #09151f; }
.checklist-row .missing-dep { color: var(--red); }
.checklist-row p { margin: 0; font-size: 10px; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(13, 25, 36, .92); box-shadow: var(--shadow); }
.two-column { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(330px, .8fr); gap: 18px; align-items: start; }
.form-layout > .panel { padding: 24px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
.section-heading h2, .section-heading p { margin-bottom: 0; }
.section-heading > p { font-size: 12px; text-align: right; }
.heading-actions { display: flex; align-items: center; gap: 12px; }
.heading-actions p { margin: 0; font-size: 11px; }
.ghost { padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.ghost:hover { color: var(--text); border-color: var(--cyan); }
.question-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.question { position: relative; min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.015); }
.question-no { position: absolute; top: 14px; right: 14px; color: #385064; font: 11px Consolas, monospace; }
.question h3 { padding-right: 28px; }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 13px; padding: 3px; border-radius: 7px; background: #07121b; }
.segmented button { min-width: 0; padding: 7px 4px; border: 0; border-radius: 5px; background: transparent; color: #718b9d; font-size: 11px; cursor: pointer; }
.segmented button:hover { color: var(--text); }
.segmented button.active { color: #041018; background: var(--cyan); font-weight: 700; }
.result-panel { position: sticky; top: 92px; overflow: hidden; }
.result-panel::before { display: block; content: ""; height: 2px; margin: -24px -24px 24px; background: linear-gradient(90deg, var(--mint), var(--cyan)); }
.result-panel.pending::before { background: var(--amber); }
.verdict-head { display: grid; grid-template-columns: 50px 1fr auto; align-items: center; gap: 12px; }
.verdict-head h2, .verdict-head small { margin: 0; }
.verdict-icon { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid rgba(108,229,255,.3); border-radius: 50%; color: var(--cyan); background: rgba(108,229,255,.06); font-size: 22px; }
.verdict-path { margin: 18px 0; padding: 13px; border-left: 2px solid var(--cyan); background: rgba(108,229,255,.035); }
.badge { display: inline-flex; align-items: center; min-height: 23px; padding: 3px 8px; margin: 2px 4px 2px 0; border: 1px solid var(--line); border-radius: 999px; color: #a6bdcb; background: rgba(255,255,255,.025); font-size: 10px; white-space: nowrap; }
.badge.confidence-high, .badge.success, .badge.confirmed { color: var(--mint); border-color: rgba(101,245,173,.25); background: rgba(101,245,173,.06); }
.badge.confidence-medium, .badge.warning { color: var(--amber); border-color: rgba(255,191,105,.27); background: rgba(255,191,105,.06); }
.badge.confidence-low { color: var(--muted); }
.badge.secret { color: var(--red); }
.badge.operational { color: var(--cyan); }
.score-bars { display: grid; gap: 8px; }
.score-bars > div { display: grid; grid-template-columns: 92px 1fr 20px; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
.score-bars i { height: 4px; overflow: hidden; border-radius: 4px; background: #07121b; }
.score-bars b { display: block; height: 100%; background: var(--cyan); }
.score-bars em { color: var(--text); font: normal 11px Consolas, monospace; }
.result-block { margin-top: 22px; }
.evidence-line { display: flex; gap: 10px; margin: 7px 0; font-size: 12px; }
.evidence-line b { color: var(--mint); font-family: Consolas, monospace; }
.notice { margin-top: 14px; padding: 12px 14px; border: 1px solid rgba(255,191,105,.22); border-radius: 8px; background: rgba(255,191,105,.045); }
.notice strong { color: var(--amber); font-size: 12px; }
.notice p { margin: 5px 0 0; font-size: 12px; line-height: 1.5; }
.notice.danger { border-color: rgba(255,115,139,.23); background: rgba(255,115,139,.045); }
.notice.danger strong { color: var(--red); }
.notice.compact { margin: 16px 0; }
.result-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; color: #668092; font-size: 11px; }
.command-panel { margin-top: 18px; padding: 24px; }
.command-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.command-card { display: flex; flex-direction: column; min-width: 0; min-height: 210px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #09141e; }
.command-card > div { display: flex; align-items: baseline; gap: 8px; }
.command-card > div span { color: var(--cyan); font: 10px Consolas, monospace; }
.command-card code { flex: 1; display: block; margin: 12px 0; overflow-wrap: anywhere; color: #a8c3d2; font-size: 10px; line-height: 1.55; }
.command-card button, .next-action button { align-self: flex-start; padding: 7px 10px; border: 1px solid rgba(108,229,255,.25); border-radius: 6px; color: var(--cyan); background: rgba(108,229,255,.04); cursor: pointer; }

.graph-hero { min-height: 205px; }
.profile-stats { display: grid; grid-template-columns: repeat(2, 120px); gap: 1px; border: 1px solid var(--line); background: var(--line); }
.profile-stats div { padding: 15px; background: #0b1721; }
.profile-stats strong, .profile-stats span { display: block; }
.profile-stats strong { color: var(--cyan); font: 28px Consolas, monospace; }
.profile-stats span { margin-top: 3px; color: var(--muted); font-size: 11px; }
.legend-row { display: flex; justify-content: space-between; gap: 18px; margin: 18px 0; }
.layer-filters, .scope-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.layer-filters button, .scope-filters button { padding: 8px 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: rgba(13,25,36,.75); cursor: pointer; font-size: 11px; }
.layer-filters button.active, .scope-filters button.active { color: var(--text); border-color: rgba(108,229,255,.45); background: rgba(108,229,255,.08); }
.layer-filters i { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; }
.knowledge-layout { display: grid; grid-template-columns: minmax(370px, .75fr) minmax(520px, 1.25fr); gap: 18px; align-items: start; }
.component-list { display: grid; gap: 7px; max-height: 850px; padding-right: 5px; overflow: auto; }
.component-card { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 11px; width: 100%; min-width: 0; padding: 12px; border: 1px solid var(--line); border-left: 2px solid var(--layer); border-radius: 9px; color: inherit; background: rgba(13,25,36,.8); text-align: left; cursor: pointer; }
.component-card:hover, .component-card.active { border-color: color-mix(in srgb, var(--layer) 48%, transparent); background: rgba(18,35,48,.95); }
.component-card.active { box-shadow: inset 3px 0 18px color-mix(in srgb, var(--layer) 12%, transparent); }
.component-card .order { color: var(--layer); font: 17px Consolas, monospace; }
.component-copy { min-width: 0; }
.component-copy strong, .component-copy small { display: block; }
.component-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.component-copy small { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.component-badges { text-align: right; }
.detail-panel { position: sticky; top: 92px; min-height: 500px; max-height: calc(100vh - 115px); padding: 25px; overflow: auto; }
.detail-title { display: flex; justify-content: space-between; gap: 20px; }
.detail-title h2 { font-size: 28px; }
.detail-summary { font-size: 14px; }
.fact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 20px 0; border: 1px solid var(--line); background: var(--line); }
.fact-grid > div { padding: 12px; background: #09151f; }
.fact-grid span, .fact-grid strong, .fact-grid small { display: block; }
.fact-grid span { margin-bottom: 8px; color: #6f899a; font-size: 10px; }
.fact-grid strong { font-size: 13px; }
.fact-grid small { margin-top: 5px; font-size: 9px; overflow-wrap: anywhere; }
.detail-section { padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--line); }
.dependency-list { display: flex; flex-wrap: wrap; gap: 6px; }
.dependency-link { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #09151f; color: #b4cad6; cursor: pointer; }
.dependency-link:hover { border-color: var(--cyan); color: var(--cyan); }
.detail-columns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--line); }
.tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; padding: 5px 7px; border-radius: 5px; color: #9fb5c2; background: #09151f; font: 10px Consolas, monospace; overflow-wrap: anywhere; }
.source-box { margin-top: 18px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #09151f; }
.source-box > strong { font-size: 12px; }
.source-box p { display: grid; grid-template-columns: 1fr auto; gap: 15px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font: 10px Consolas, monospace; }
.source-box p span { color: var(--cyan); }
.activation-panel, .contracts-panel, .pitfalls-panel { margin-top: 18px; padding: 24px; }
.activation-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.activation-card { padding: 17px; border: 1px solid var(--line); border-radius: 10px; background: #09151f; }
.activation-title { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
.activation-title h3 { font-size: 17px; }
.activation-title small { display: block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 9px Consolas, monospace; }
.chain-steps { display: grid; margin-top: 12px; }
.chain-steps > div { display: grid; grid-template-columns: 25px 1px 1fr; gap: 9px; min-height: 105px; }

  yes: '是',
  no: '否',
  unknown: '未知',
  single: '单节点',
  multi: '多节点'
};

function addScore(scores, details, target, points, reason) {
  scores[target] += points;
  details[target].push({ points, reason });
}

function detectForm(input = {}) {
  const value = key => input[key] || 'unknown';
  const scores = { hostEm: 0, emK8s: 0, helmK8s: 0, compose: 0 };
  const details = { hostEm: [], emK8s: [], helmK8s: [], compose: [] };
  const conflicts = [];

  if (value('optDtstack') === 'yes') addScore(scores, details, 'hostEm', 4, '存在主机化安装目录');
  if (value('systemService') === 'yes') addScore(scores, details, 'hostEm', 3, '存在主机服务或进程');
  if (value('kubectl') === 'no') addScore(scores, details, 'hostEm', 2, '现场不可使用 kubectl');
  if (value('emPort') === 'yes') addScore(scores, details, 'hostEm', 1, '发现 EM 端口指纹');

  if (value('kubectl') === 'yes') {
    addScore(scores, details, 'emK8s', 2, 'kubectl 可用');
    addScore(scores, details, 'helmK8s', 2, 'kubectl 可用');
  }
  if (value('dtstackNamespace') === 'yes') {
    addScore(scores, details, 'emK8s', 2, '存在 dtstack 命名空间');
    addScore(scores, details, 'helmK8s', 2, '存在 dtstack 命名空间');
  }
  if (value('easymanagerNamespace') === 'yes') addScore(scores, details, 'emK8s', 5, '存在 easymanager 命名空间');
  if (value('easymanagerNamespace') === 'no' && value('helmReleases') === 'yes') {
    addScore(scores, details, 'helmK8s', 4, '存在 Helm release 且无 easymanager 命名空间');
  }
  if (value('helmReleases') === 'yes') {
    addScore(scores, details, 'emK8s', 1, '存在 Helm release');
    addScore(scores, details, 'helmK8s', 2, '存在 Helm release');
  }
  if (value('emPort') === 'yes') addScore(scores, details, 'emK8s', 1, '发现 EM 端口指纹');

  if (value('compose') === 'yes') addScore(scores, details, 'compose', 6, '存在 Docker Compose 项目');
  if (value('topology') === 'single') addScore(scores, details, 'compose', 2, '现场为单节点拓扑');
  if (value('kubectl') === 'no') addScore(scores, details, 'compose', 1, '未使用 Kubernetes 控制面');

  if (value('easymanagerNamespace') === 'yes' && value('kubectl') === 'no') {
    conflicts.push('声称存在 easymanager 命名空间，但 kubectl 不可用，证据来源需复核。');
  }
  if (value('compose') === 'yes' && value('dtstackNamespace') === 'yes') {
    conflicts.push('同时存在 Compose 与 K8s 指纹，可能是混合环境，不能只看单一信号。');
  }
  if (value('optDtstack') === 'yes' && value('easymanagerNamespace') === 'yes') {
    conflicts.push('主机目录与 EM-on-K8s 指纹并存，需确认目录是遗留物还是当前控制源。');
  }

  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [winner, second] = ranked;
  const decisive = winner[1] >= 5 && winner[1] - second[1] >= 2;
  const selectedKey = decisive ? winner[0] : 'unknown';
  const selected = FORM_OPTIONS[selectedKey];
  const missing = [];

  if (value('kubectl') === 'unknown') missing.push('kubectl 是否可用');
  if (value('dtstackNamespace') === 'unknown') missing.push('dtstack 命名空间');
  if (value('easymanagerNamespace') === 'unknown') missing.push('easymanager 命名空间');
  if (value('helmReleases') === 'unknown') missing.push('Helm release');
  if (value('optDtstack') === 'unknown') missing.push('/opt/dtstack 目录');

  const topology = value('topology');
  return {
    id: selected.id,
    label: selected.label,
    path: selected.path,
    confidence: decisive && conflicts.length === 0 ? 'high' : decisive ? 'medium' : 'low',
    orchestrator: selected.id === 'em-k8s' ? 'em-k8s' : selected.id === 'helm-k8s' ? 'helm-k8s' : selected.id === 'host-em' ? 'host' : selected.id === 'single-compose' ? 'compose' : 'unknown',
    scale: topology,
    scaleLabel: LABELS[topology] || '未知',
    platform: { os: value('osFamily'), arch: value('arch'), storage: value('storage') },
    decisiveEvidence: selectedKey === 'unknown' ? [] : details[selectedKey],
    conflicts,
    missing: missing.slice(0, 3),
    scores,
    commands: PROBE_COMMANDS
  };
}

function getRule(ruleId) {
  return RULES.find(rule => rule.id === ruleId) || null;
}

function matchRules(signals = []) {
  const active = new Set(signals);
  return RULES.map(rule => ({
    rule,
    score: rule.fingerprints.reduce((sum, fingerprint) => sum + (active.has(fingerprint.id) ? fingerprint.weight : 0), 0)
  })).filter(match => match.score > 0)
    .sort((a, b) => b.score - a.score || a.rule.id.localeCompare(b.rule.id));
}


const CATEGORY_CAPS = {
  config: 30,
  object: 30,
  runtime: 30,
  result: 30,
  event: 30,
  material: 30
};

const CATEGORY_LABELS = {
  config: '配置/声明',
  object: '对象',
  runtime: '运行态',
  result: '业务结果',
  event: '事件',
  material: '物料'
};

function confidenceFor(score, categoryCount) {
  if (score >= 70 && categoryCount >= 3) return 'high';
  if (score >= 40 && categoryCount >= 2) return 'medium';
  return 'low';
}

function scoreRule(rule, answers = {}) {
  if (!rule) return { candidates: [], gaps: [], progress: { answered: 0, total: 0, percent: 0 } };

  const candidateState = new Map(rule.candidates.map(candidate => [candidate.id, {
    ...candidate,
    categoryScores: {},
    reasons: [],
    riskSignals: [],
    propagationSignals: []
  }]));

  for (const evidence of rule.evidence) {
    if (answers[evidence.id] !== 'confirmed') continue;
    for (const [candidateId, points] of Object.entries(evidence.supports || {})) {
      const candidate = candidateState.get(candidateId);
      if (!candidate) continue;
      if (evidence.role === 'risk') {
        candidate.riskSignals.push({ evidenceId: evidence.id, label: evidence.label });
        continue;
      }
      if (evidence.role === 'propagation' || points <= 0) {
        candidate.propagationSignals.push({ evidenceId: evidence.id, label: evidence.label });
        continue;
      }
      const current = candidate.categoryScores[evidence.category] || 0;
      const cap = CATEGORY_CAPS[evidence.category] || 30;
      const accepted = Math.max(0, Math.min(points, cap - current));
      if (accepted > 0) {
        candidate.categoryScores[evidence.category] = current + accepted;
        candidate.reasons.push({
          evidenceId: evidence.id,
          label: evidence.label,
          category: evidence.category,
          role: evidence.role,
          points: accepted
        });
      }
    }
  }

  const candidates = [...candidateState.values()].map(candidate => {
    const categories = Object.keys(candidate.categoryScores);
    const score = Object.values(candidate.categoryScores).reduce((sum, points) => sum + points, 0);
    return {
      id: candidate.id,
      title: candidate.title,
      detail: candidate.detail,
      score,
      conclusionConfidence: confidenceFor(score, categories.length),
      categories,
      reasons: candidate.reasons,
      riskSignals: candidate.riskSignals,
      propagationSignals: candidate.propagationSignals
    };
  }).filter(candidate => candidate.score > 0)
    .sort((a, b) => b.score - a.score || b.categories.length - a.categories.length || a.id.localeCompare(b.id))
    .slice(0, 3);

  const gaps = rule.evidence.filter(evidence => ['unknown', 'forbidden', 'stale', 'invalid'].includes(answers[evidence.id] || 'unknown'))
    .map(evidence => ({ id: evidence.id, label: evidence.label, state: answers[evidence.id] || 'unknown', category: evidence.category }));
  const answered = rule.evidence.filter(evidence => ['confirmed', 'excluded', 'forbidden', 'stale', 'invalid'].includes(answers[evidence.id])).length;

  return {
    candidates,
    gaps,
    progress: {
      answered,
      total: rule.evidence.length,
      percent: rule.evidence.length ? Math.round(answered / rule.evidence.length * 100) : 0,
      forbidden: gaps.filter(gap => gap.state === 'forbidden').length,
      stale: gaps.filter(gap => gap.state === 'stale').length,
      invalid: gaps.filter(gap => gap.state === 'invalid').length
    }
  };
}

function createUnknownAnswers(rule) {
  return Object.fromEntries((rule?.evidence || []).map(evidence => [evidence.id, 'unknown']));
}


const TEXT_EXTENSIONS = new Set(['yaml', 'yml', 'json', 'txt', 'conf', 'cfg', 'properties', 'env', 'ini', 'xml', 'sh', 'md']);
const ARCHIVE_PATTERN = /\.(?:tgz|tar|tar\.gz)$/i;
const MAX_FILES = 500;
const MAX_TOTAL_BYTES = 120 * 1024 * 1024;
const MAX_TEXT_BYTES = 2 * 1024 * 1024;
const MAX_ARCHIVE_BYTES = 80 * 1024 * 1024;

const severityOrder = { blocker: 0, warning: 1, notice: 2 };

function extensionOf(name) {
  const lower = name.toLowerCase();
  if (lower.endsWith('.tar.gz')) return 'tar.gz';
  return lower.includes('.') ? lower.split('.').pop() : '';
}

function safePath(file) {
  return file.webkitRelativePath || file.relativePath || file.name || '未命名文件';
}

function decodeAscii(bytes, start, length) {
  let result = '';
  for (let index = start; index < start + length && bytes[index]; index += 1) {
    result += String.fromCharCode(bytes[index]);
  }
  return result.trim();
}

function parseTarEntries(input, options = {}) {
  const bytes = input instanceof Uint8Array ? input : new Uint8Array(input);
  const maxEntries = options.maxEntries || 2500;
  const maxTextBytes = options.maxTextBytes || 512 * 1024;
  const entries = [];
  let offset = 0;

  while (offset + 512 <= bytes.length && entries.length < maxEntries) {
    const name = decodeAscii(bytes, offset, 100);
    if (!name) break;
    const prefix = decodeAscii(bytes, offset + 345, 155);
    const fullName = prefix ? `${prefix}/${name}` : name;
    const sizeText = decodeAscii(bytes, offset + 124, 12).replace(/\0/g, '').trim();
    const size = Number.parseInt(sizeText || '0', 8);
    if (!Number.isFinite(size) || size < 0) break;
    const type = String.fromCharCode(bytes[offset + 156] || 48);
    const dataStart = offset + 512;
    const dataEnd = Math.min(dataStart + size, bytes.length);
    const extension = extensionOf(fullName);
    const textEligible = (TEXT_EXTENSIONS.has(extension) || /(?:Chart\.yaml|values(?:-[^/]*)?\.ya?ml)$/i.test(fullName)) && size <= maxTextBytes;
    let text = '';
    if (textEligible && type !== '5') {
      try { text = new TextDecoder('utf-8', { fatal: false }).decode(bytes.slice(dataStart, dataEnd)); } catch (_) { text = ''; }
    }
    entries.push({ name: fullName, size, type, text });
    offset = dataStart + Math.ceil(size / 512) * 512;
  }
  return entries;
}

async function gunzip(buffer) {
  if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器不支持本地 gzip 解包');
  const stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function issue(severity, category, title, detail, file = '', line = 0, fix = '') {
  return { severity, category, title, detail, file, line, fix };
}

function maskedKey(raw) {
  return String(raw || '').replace(/[^a-zA-Z0-9_.-]/g, '').slice(0, 80);
}

function inspectText(path, text, aggregate) {
  const lines = text.split(/\r?\n/);
  const images = [];
  const switches = [];

  lines.forEach((lineText, index) => {
    const line = index + 1;
    const clean = lineText.replace(/\s+#.*$/, '');
    const jobCount = clean.match(/^\s*(?:global\.)?(?:plugin\.)?jobCount\s*[:=]\s*["']?(-?\d+)/i);
    if (jobCount && Number(jobCount[1]) === 0) {
      aggregate.issues.push(issue('blocker', '配置', 'plugin.jobCount 为 0', '插件 Job 可能显示 0/0 且不会创建 Pod。', path, line, '填写项目期望数量；已创建的 Job 需要按批准流程重新安装对应 Chart。'));
    }

    const switchMatch = clean.match(/^\s*(ai_switch|batch\.ai\.switch|stream\.ai\.switch|index\.ai\.support)\s*[:=]\s*["']?(true|false)/i);
    if (switchMatch) switches.push({ key: switchMatch[1], value: switchMatch[2].toLowerCase(), file: path, line });

    const endpoint = clean.match(/^\s*([\w.-]*(?:url|host|endpoint)[\w.-]*)\s*[:=]\s*["']?([^\s#"']+)/i);
    if (endpoint && /(?:127\.0\.0\.1|localhost)/i.test(endpoint[2])) {
      aggregate.issues.push(issue('blocker', '配置', '服务地址回落到本机', `${maskedKey(endpoint[1])} 指向回环地址；除非产品契约明确要求同 Pod sidecar，否则通常无法访问目标服务。`, path, line, '核对声明层 key、密文解密结果和真实 Service 名。'));
    }

    const redisUrl = clean.match(/^\s*(redis\.url|redisUrl)\s*[:=]\s*["']?([^\s#"']+)/i);
    if (redisUrl && !/(?:redis-standalone-master|\$\{|\{\{)/i.test(redisUrl[2])) {
      aggregate.issues.push(issue('warning', '服务契约', 'Redis 服务名需要复核', '当前值未匹配主 Profile 的 redis-standalone-master 契约。报告不会保存实际地址。', path, line, '与现场 Service/FQDN 核对，不能只确认端口。'));
    }

    const endpointState = clean.match(/^\s*(minio\.endpoint|s3\.endpoint|MINIO_ENDPOINT)\s*[:=]\s*(.*)$/i);
    if (endpointState) {
      const value = endpointState[2].trim().replace(/^['"]|['"]$/g, '');
      aggregate.endpointStates.push({ key: endpointState[1], state: value ? 'non-empty' : 'empty', file: path, line });
    }

    const secret = clean.match(/^\s*([\w.-]*(?:password|passwd|token|secretKey|accessKey|access_key|secret_key|\.ak|\.sk))\s*[:=]\s*(.+)$/i);
    if (secret) {
      const value = secret[2].trim().replace(/^['"]|['"]$/g, '');
      const protectedValue = !value || /^\$\{|^\{\{|^ENC\(|^<.*>$|^\*+$|^x+$|^null$/i.test(value);
      if (!protectedValue) {
        aggregate.issues.push(issue('warning', '保密', '疑似明文秘密字段', `发现 ${maskedKey(secret[1])} 存在非占位值；报告未保存该值。`, path, line, '确认文件是否允许携带；优先改用批准的密文或 Secret 引用。'));
      }
    }

    const image = clean.match(/^\s*image\s*:\s*["']?([^\s#"']+)/i);
    if (image) {
      images.push({ value: image[1], file: path, line });
      if (/:latest$/i.test(image[1]) || (!image[1].includes('@sha256:') && !/:[^/]+$/.test(image[1]))) {
        aggregate.issues.push(issue('warning', '镜像', '镜像版本不可稳定追溯', '镜像使用 latest 或未显式声明 tag/digest。', path, line, '使用批准的 tag，并在验收时记录仓库 digest 和 Pod imageID。'));
      }
    }
  });

  const initPosition = text.search(/\binitContainers\s*:/i);
  if (initPosition >= 0) {
    const initText = text.slice(initPosition);
    const fluentMatch = initText.match(/(?:^|\n)\s*-?\s*name\s*:\s*["']?([^\s"']*fluent[^\s"']*)["']?/i);
    if (fluentMatch) {
      const start = fluentMatch.index || 0;
      const next = initText.slice(start + fluentMatch[0].length).search(/\n\s*-\s*name\s*:/);
      const block = next >= 0 ? initText.slice(start, start + fluentMatch[0].length + next) : initText.slice(start, start + 1200);
      if (!/restartPolicy\s*:\s*Always/i.test(block)) {
        const line = text.slice(0, initPosition + start).split(/\r?\n/).length;
        aggregate.issues.push(issue('blocker', 'Chart', 'fluent 日志侧车缺少 restartPolicy: Always', '它可能被当成普通 init container，导致 Pod 长期卡在 Init:0/N。', path, line, '核对 Pod 与控制器模板中的 initContainers[].restartPolicy。'));
      }
    }
  }

  if (/imagePullPolicy\s*:\s*IfNotPresent/i.test(text) && images.some(item => !item.value.includes('@sha256:'))) {
    aggregate.issues.push(issue('warning', '镜像', 'IfNotPresent 与可变 tag 组合存在旧缓存风险', '换包或同 tag 更新后，节点可能继续使用旧 imageID。', path, 0, '升级验收必须比较仓库 digest 与各 Pod imageID。'));
  }

  aggregate.images.push(...images);
  aggregate.switches.push(...switches);
}

function chartMetadata(path, text) {
  if (!/(?:^|\/)Chart\.yaml$/i.test(path)) return null;
  const name = text.match(/^\s*name\s*:\s*["']?([^\s#"']+)/mi)?.[1] || '';
  const version = text.match(/^\s*version\s*:\s*["']?([^\s#"']+)/mi)?.[1] || '';
  return name ? { name, version, path } : null;
}

async function inspectFile(file, aggregate) {
  const path = safePath(file);
  const extension = extensionOf(path);
  aggregate.paths.push(path);

  if (/\.done$/i.test(path)) {
    aggregate.issues.push(issue('warning', '物料', '.done 不能证明物料已经生效', '发现完成标记，但仍需核对 Chart 入库、仓库 digest 和运行对象。', path, 0, '不要把完成标记作为唯一验收依据。'));
  }

  if (TEXT_EXTENSIONS.has(extension)) {
    if (file.size > MAX_TEXT_BYTES) {
      aggregate.issues.push(issue('notice', '输入', '文本文件超过解析上限', `文件大于 ${MAX_TEXT_BYTES / 1024 / 1024}MB，本次只登记文件名。`, path));
      return;
    }
    const text = await file.text();
    aggregate.textFiles += 1;
    inspectText(path, text, aggregate);
    const chart = chartMetadata(path, text);
    if (chart) aggregate.charts.push(chart);
    return;
  }

  if (!ARCHIVE_PATTERN.test(path)) return;
  aggregate.archives += 1;
  if (file.size > MAX_ARCHIVE_BYTES) {
    aggregate.issues.push(issue('notice', '输入', '归档文件超过浏览器解析上限', `文件大于 ${MAX_ARCHIVE_BYTES / 1024 / 1024}MB，本次只按文件名参与物料匹配。`, path));
    return;
  }

  try {
    let bytes = new Uint8Array(await file.arrayBuffer());
    if (/\.(?:tgz|tar\.gz)$/i.test(path)) bytes = await gunzip(bytes);
    const entries = parseTarEntries(bytes);
    aggregate.archiveEntries += entries.length;
    aggregate.paths.push(...entries.map(entry => `${path}::${entry.name}`));
    const charts = entries.filter(entry => /(?:^|\/)Chart\.yaml$/i.test(entry.name)).map(entry => chartMetadata(entry.name, entry.text)).filter(Boolean);
    aggregate.charts.push(...charts.map(chart => ({ ...chart, path: `${path}::${chart.path}` })));
    const isOci = entries.some(entry => /(?:^|\/)oci-layout$/.test(entry.name)) && entries.some(entry => /(?:^|\/)index\.json$/.test(entry.name));
    const isDocker = entries.some(entry => /(?:^|\/)manifest\.json$/.test(entry.name));
    if (isOci || isDocker) aggregate.imageArchives.push({ path, format: isOci ? 'OCI' : 'Docker archive' });
    if (charts.length > 1) {
      aggregate.issues.push(issue('warning', '物料', '一个归档中包含多个 Chart', `检测到 ${charts.length} 个 Chart：${charts.map(chart => chart.name).join('、')}。上传脚本如果只取第一个，可能遗漏顶层或子 Chart。`, path, 0, '逐个确认顶层 Chart、子 Chart和 EM 入库结果。'));
    }
    entries.filter(entry => entry.text).forEach(entry => {
      const entryPath = `${path}::${entry.name}`;
      inspectText(entryPath, entry.text, aggregate);
    });
  } catch (error) {
    aggregate.issues.push(issue('notice', '输入', '归档文件未能展开', error.message || '浏览器无法识别该归档格式。', path, 0, '仍会使用文件名做物料匹配；可在解压后重新选择目录。'));
  }
}

function candidateNames(component) {
  return [component.id, component.name, ...(component.pkgNames || []), ...(component.chartNames || []), ...(component.imageRepos || []).map(value => value.split('/').pop())]
    .filter(value => value && String(value).length >= 3)
    .map(value => String(value).toLowerCase());
}

function containsCandidate(haystack, candidate) {
  const escaped = candidate.replace(/[.*+?^${}()|[\]\\]/g, '\\/*__SCRIPT__*/');
  return new RegExp(`(^|[^a-z0-9])${escaped}(?=$|[^a-z0-9-]|-v?\\d)`, 'i').test(haystack);
}

function mapComponents(profile, aggregate, mode) {
  const evidence = [...aggregate.paths, ...aggregate.charts.map(chart => chart.name), ...aggregate.images.map(image => image.value)];
  const components = profile.components.map(component => {
    const candidates = candidateNames(component);
    const files = evidence.filter(item => candidates.some(candidate => containsCandidate(String(item).toLowerCase(), candidate))).slice(0, 6);
    const bundled = component.artifactType === 'sealos-bundled';
    const status = bundled ? 'verify' : files.length ? 'found' : 'missing';
    return { id: component.id, name: component.name, artifactType: component.artifactType, scope: component.scope, deployOrder: component.deployOrder, dependsOn: component.dependsOn || [], status, files };
  });

  if (mode === 'full') {
    components.filter(component => component.scope === 'required' && component.status === 'missing').forEach(component => {
      aggregate.issues.push(issue('blocker', '缺件', `缺少必需物料：${component.name}`, `${component.artifactType === 'image-only' ? '任务镜像' : 'Chart/组件包'}未在所选目录或归档清单中匹配。`, '', 0, '核对物料清单、包名映射和本项目裁剪范围。'));
    });
  }

  const byId = Object.fromEntries(components.map(component => [component.id, component]));
  const checklistBase = mode === 'config'
    ? []
    : mode === 'full'
      ? components.filter(component => component.scope === 'required')
      : components.filter(component => component.status === 'found' || component.status === 'verify');
  const checklist = checklistBase.sort((a, b) => (a.deployOrder ?? 999) - (b.deployOrder ?? 999) || a.name.localeCompare(b.name)).map(component => {
    const missingDependencies = component.dependsOn.filter(id => byId[id] && byId[id].status === 'missing');
    const acceptance = component.artifactType === 'image-only'
      ? '核对仓库 digest 与任务对象引用；不能只看上传完成。'
      : component.artifactType === 'sealos-bundled'
        ? '只核验运行状态和版本，不重复安装。'
        : '核对渲染对象、Service、Pod Ready、imageID 和最小业务结果。';
    return { ...component, missingDependencies, acceptance };
  });
  return { components, checklist };
}

function addCrossChecks(aggregate, mapping) {
  const byId = Object.fromEntries(mapping.components.map(component => [component.id, component]));
  const enabled = aggregate.switches.filter(item => item.value === 'true');
  for (const item of enabled) {
    const required = item.key.toLowerCase() === 'index.ai.support' ? ['easyindex', 'aiworks'] : ['aiworks'];
    const missing = required.filter(id => byId[id]?.status === 'missing');
    if (missing.length) {
      aggregate.issues.push(issue('warning', '范围', `${item.key}=true，但相关物料未匹配`, `缺少：${missing.map(id => byId[id]?.name || id).join('、')}。开关开启不等于组件已经安装。`, item.file, item.line, '确认项目范围；若不交付 AI 能力，应关闭对应开关。'));
    }
  }
  for (const endpoint of aggregate.endpointStates) {
    if (endpoint.state === 'non-empty') {
      aggregate.issues.push(issue('notice', '配置', `${endpoint.key} 为 non-empty`, '该值是否应为空取决于项目 Profile，不能使用统一规则直接判错。', endpoint.file, endpoint.line, '与对象存储接入方式和批准的 Profile 对照。'));
    }
  }
}

async function analyzePreflight(fileList, profile, options = {}) {
  const mode = options.mode || 'full';
  const files = Array.from(fileList || []);
  const aggregate = {
    issues: [], paths: [], charts: [], images: [], imageArchives: [], switches: [], endpointStates: [],
    textFiles: 0, archives: 0, archiveEntries: 0
  };
  const totalBytes = files.reduce((sum, file) => sum + (file.size || 0), 0);

  if (!files.length) {
    return { mode, profileId: profile.profileId, generatedAt: new Date().toISOString(), inventory: { files: 0, totalBytes: 0 }, issues: [], components: [], checklist: [], charts: [], images: [], imageArchives: [] };
  }
  if (files.length > MAX_FILES) aggregate.issues.push(issue('notice', '输入', '文件数量已截断', `最多分析 ${MAX_FILES} 个文件，本次选择 ${files.length} 个。`));
  if (totalBytes > MAX_TOTAL_BYTES) aggregate.issues.push(issue('notice', '输入', '选择内容较大', '浏览器只展开受支持且大小未超限的文本和归档，其余文件只使用文件名匹配。'));

  for (const file of files.slice(0, MAX_FILES)) await inspectFile(file, aggregate);
  const mapping = mapComponents(profile, aggregate, mode);
  addCrossChecks(aggregate, mapping);

  const deduplicated = [];
  const seen = new Set();
  for (const item of aggregate.issues) {
    const key = [item.severity, item.title, item.file, item.line].join('|');
    if (!seen.has(key)) { seen.add(key); deduplicated.push(item); }
  }
  deduplicated.sort((a, b) => severityOrder[a.severity] - severityOrder[b.severity] || a.category.localeCompare(b.category) || a.title.localeCompare(b.title));

  return {
    mode,
    profileId: profile.profileId,
    generatedAt: new Date().toISOString(),
    inventory: {
      files: files.length,
      analyzedFiles: Math.min(files.length, MAX_FILES),
      totalBytes,
      textFiles: aggregate.textFiles,
      archives: aggregate.archives,
      archiveEntries: aggregate.archiveEntries
    },
    issues: deduplicated,
    components: mapping.components,
    checklist: mapping.checklist,
    charts: aggregate.charts,
    images: aggregate.images,
    imageArchives: aggregate.imageArchives
  };
}

function preflightSummary(result) {
  const count = severity => result.issues.filter(item => item.severity === severity).length;
  return {
    blockers: count('blocker'),
    warnings: count('warning'),
    notices: count('notice'),
    foundComponents: result.components.filter(item => item.status === 'found').length,
    missingComponents: result.components.filter(item => item.status === 'missing' && item.scope === 'required').length
  };
}

function getNavigatorFlow(flowId) {
  return NAVIGATOR_FLOWS.find(flow => flow.id === flowId) || null;
}

function createNavigatorSession(flowId) {
  const flow = getNavigatorFlow(flowId);
  if (!flow) return null;
  return { flowId, currentNodeId: flow.start, history: [], conclusionId: null };
}

function advanceNavigator(session, optionId) {
  const flow = getNavigatorFlow(session?.flowId);
  const node = flow?.nodes[session?.currentNodeId];
  const option = node?.options.find(item => item.id === optionId);
  if (!flow || !node || !option || session.conclusionId) return session;
  const history = [...session.history, {
    nodeId: node.id || session.currentNodeId,
    title: node.title,
    optionId: option.id,
    answer: option.label,
    evidence: option.evidence || '',
    excludes: option.excludes || ''
  }];
  return {
    flowId: session.flowId,
    currentNodeId: option.next || null,
    history,
    conclusionId: option.conclusion || null
  };
}

function backNavigator(session) {
  const flow = getNavigatorFlow(session?.flowId);
  if (!flow || !session?.history?.length) return session;
  const history = session.history.slice(0, -1);
  const previous = session.history.at(-1);
  return { flowId: session.flowId, currentNodeId: previous.nodeId, history, conclusionId: null };
}

function navigatorView(session) {
  const flow = getNavigatorFlow(session?.flowId);
  if (!flow) return { flow: null, node: null, conclusion: null };
  return {
    flow,
    node: session.conclusionId ? null : flow.nodes[session.currentNodeId] || null,
    conclusion: session.conclusionId ? flow.conclusions[session.conclusionId] || null : null
  };

const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
}[character]));

const labelMaps = {
  confidence: { confirmed: '已核实', pending: '待核实', high: '高', medium: '中', low: '低' },
  scope: { required: '必需', conditional: '条件', na: '不适用', deferred: '后置' },
  artifact: { 'sealos-bundled': 'Sealos 自带', chart: 'Chart', 'image-only': '仅镜像' },
  freshness: { current: '有效', stale: '已过期' }
};

function badge(text, tone = '') {
  return `<span class="badge ${tone}">${escapeHtml(text)}</span>`;
}

function list(items, empty = '未记录') {
  if (!items?.length) return `<span class="muted">${empty}</span>`;
  return `<div class="tag-list">${items.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>`;
}

function daysSince(dateText) {
  const value = new Date(`${dateText}T00:00:00+08:00`).getTime();
  return Number.isFinite(value) ? Math.floor((Date.now() - value) / 86400000) : 0;
}

function freshness(item) {
  const age = daysSince(item.verifiedAt);
  return { status: age > (item.validForDays || 180) ? 'stale' : 'current', age };
}

function copyText(text, button) {
  const done = () => {
    const original = button.textContent;
    button.textContent = '已复制';
    setTimeout(() => { button.textContent = original; }, 1200);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}

function fallbackCopy(text, done) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.className = 'copy-helper';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); done(); } catch (_) { /* 浏览器不允许时保持只读展示 */ }
  area.remove();
}

function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return `${(bytes / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`;
}

function renderNavigatorConclusion(flow, conclusion, session) {

  const trail = session.history.map((item, index) => `<tr><td>${index + 1}</td><td>${escapeHtml(item.title)}</td><td>${escapeHtml(item.answer)}</td><td>${escapeHtml(item.evidence)}</td><td>${escapeHtml(item.excludes || '—')}</td></tr>`).join('');

  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `xingtu-troubleshooting-${flow.id}-${new Date().toISOString().slice(0, 10)}.html`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function bindNavigator() {
  document.querySelectorAll('[data-navigator-flow]').forEach(button => button.addEventListener('click', () => {
    state.navigatorFlowId = button.dataset.navigatorFlow;
    state.navigatorSession = createNavigatorSession(state.navigatorFlowId);
    render();
  }));
  document.querySelectorAll('[data-navigator-option]').forEach(button => button.addEventListener('click', () => {
    state.navigatorSession = advanceNavigator(state.navigatorSession, button.dataset.navigatorOption);
    render();
  }));
  document.getElementById('navigator-back')?.addEventListener('click', () => { state.navigatorSession = backNavigator(state.navigatorSession); render(); });
  document.getElementById('navigator-reset')?.addEventListener('click', () => { state.navigatorSession = createNavigatorSession(state.navigatorFlowId); render(); });
  document.getElementById('navigator-export')?.addEventListener('click', exportNavigatorRecord);
}

function issueFilter(id, label, count) {
  return `<button class="${state.preflightFilter === id ? 'active' : ''}" data-issue-filter="${id}">${label} <b>${count}</b></button>`;
}

function materialRow(item, statusLabels) {
  return `<article><div><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(labelMaps.artifact[item.artifactType])} · ${escapeHtml(labelMaps.scope[item.scope])}</small></div><span class="status-${item.status}">${statusLabels[item.status]}</span>${item.files.length ? `<small title="${escapeHtml(item.files.join('\n'))}">${escapeHtml(item.files[0])}</small>` : ''}</article>`;
}

async function runPreflight(files) {
  if (!files?.length) return;
  state.preflightBusy = true;
  state.preflightError = '';
  state.preflightResult = null;
  render();
  try {
    state.preflightResult = await analyzePreflight(files, profile, { mode: state.preflightMode });
  } catch (error) {
    state.preflightError = error?.message || '未知错误';
  } finally {
    state.preflightBusy = false;
    render();
  }
}

function exportPreflightReport(result) {
  const summary = preflightSummary(result);
  const labels = { blocker: '阻断', warning: '警告', notice: '提示' };
  const rows = result.issues.map(item => `<tr><td>${labels[item.severity]}</td><td>${escapeHtml(item.category)}</td><td>${escapeHtml(item.title)}</td><td>${escapeHtml(item.file)}${item.line ? `:${item.line}` : ''}</td><td>${escapeHtml(item.detail)}</td><td>${escapeHtml(item.fix)}</td></tr>`).join('');
  const steps = result.checklist.map(item => `<tr><td>${item.deployOrder ?? '—'}</td><td>${escapeHtml(item.name)}</td><td>${escapeHtml(labelMaps.artifact[item.artifactType])}</td><td>${escapeHtml(item.status)}</td><td>${escapeHtml(item.dependsOn.join('、'))}</td><td>${escapeHtml(item.acceptance)}</td></tr>`).join('');
  const html = `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>星图部署前质检报告</title><style>body{font:14px/1.6 Arial,"Microsoft YaHei",sans-serif;color:#17212b;max-width:1400px;margin:32px auto;padding:0 24px}h1{margin-bottom:4px}small{color:#667}section{margin:28px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #ccd5dd;text-align:left;vertical-align:top}th{background:#eef3f6}.cards{display:flex;gap:12px}.cards b{font-size:26px}.cards span{padding:12px 18px;border:1px solid #ccd5dd}.warn{padding:12px;background:#fff5db;border-left:4px solid #e5a52b}</style></head><body><h1>星图部署前质检报告</h1><small>生成时间：${escapeHtml(result.generatedAt)} · Profile：${escapeHtml(result.profileId)} · 模式：${escapeHtml(result.mode)}</small><p class="warn">本报告只包含规则结论和相对文件名，不包含已识别的秘密值。外发前仍须人工检查文件名和项目范围。</p><div class="cards"><span>阻断<br><b>${summary.blockers}</b></span><span>警告<br><b>${summary.warnings}</b></span><span>提示<br><b>${summary.notices}</b></span><span>文件<br><b>${result.inventory.files}</b></span></div><section><h2>质检问题</h2><table><thead><tr><th>等级</th><th>类别</th><th>问题</th><th>位置</th><th>说明</th><th>建议</th></tr></thead><tbody>${rows || '<tr><td colspan="6">未发现已支持规则范围内的问题</td></tr>'}</tbody></table></section><section><h2>施工清单</h2><table><thead><tr><th>顺序</th><th>组件</th><th>类型</th><th>状态</th><th>依赖</th><th>验收判据</th></tr></thead><tbody>${steps}</tbody></table></section></body></html>`;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = `xingtu-preflight-${new Date().toISOString().slice(0, 10)}.html`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function bindPreflight() {
  document.querySelectorAll('[data-preflight-mode]').forEach(button => button.addEventListener('click', () => {
    state.preflightMode = button.dataset.preflightMode;
    state.preflightResult = null;
    state.preflightError = '';
    render();
  }));
  document.querySelectorAll('[data-issue-filter]').forEach(button => button.addEventListener('click', () => { state.preflightFilter = button.dataset.issueFilter; render(); }));
  document.getElementById('preflight-files')?.addEventListener('change', event => runPreflight(event.target.files));
  document.getElementById('preflight-directory')?.addEventListener('change', event => runPreflight(event.target.files));
  document.getElementById('load-preflight-demo')?.addEventListener('click', () => { state.preflightMode = 'incremental'; runPreflight(preflightDemoFiles()); });
  document.getElementById('export-preflight')?.addEventListener('click', () => exportPreflightReport(state.preflightResult));
  const drop = document.getElementById('preflight-drop');
  drop?.addEventListener('dragover', event => { event.preventDefault(); drop.classList.add('dragging'); });
  drop?.addEventListener('dragleave', () => drop.classList.remove('dragging'));
  drop?.addEventListener('drop', event => { event.preventDefault(); drop.classList.remove('dragging'); runPreflight(event.dataTransfer.files); });
}

}

function candidateCard(candidate, index) {
  return `<article class="candidate rank-${index + 1}"><div class="candidate-score"><span>#${index + 1}</span><strong>${candidate.score}</strong></div><div><div class="candidate-meta">${badge(`${labelMaps.confidence[candidate.conclusionConfidence]}可信`, `confidence-${candidate.conclusionConfidence}`)}${candidate.categories.map(category => badge(CATEGORY_LABELS[category])).join('')}</div><h3>${escapeHtml(candidate.title)}</h3><p>${escapeHtml(candidate.detail)}</p>${candidate.reasons.map(reason => `<small>+${reason.points} · ${escapeHtml(reason.label)}</small>`).join('')}${candidate.riskSignals.length ? `<small class="risk">风险背景：${candidate.riskSignals.map(item => escapeHtml(item.label)).join('、')}</small>` : ''}</div></article>`;
}

function bindRules() {
  document.querySelectorAll('[data-rule]').forEach(button => button.addEventListener('click', () => { state.ruleId = button.dataset.rule; render(); }));
  document.querySelectorAll('[data-evidence]').forEach(select => select.addEventListener('change', () => {
    currentAnswers(getRule(state.ruleId))[select.dataset.evidence] = select.value;
    render();
  }));
  document.getElementById('reset-evidence')?.addEventListener('click', () => { state.answers[state.ruleId] = createUnknownAnswers(getRule(state.ruleId)); render(); });
  document.getElementById('load-replay')?.addEventListener('click', () => {
    state.answers[state.ruleId] = { ...createUnknownAnswers(getRule(state.ruleId)), ...replays[state.ruleId] };
    render();
  });
}


// ---------------------------------------------------------------- 能力矩阵
const CAPS = CAPS_DATA.capabilities;

const CAP_TONE = {
  '已启用': 'success', '已部署': 'success',
  '装了没用': 'warning', '未达高可用': 'warning',
  '配了没生效': 'danger', '配置悬空': 'danger',
  '需人工核验': '',
  '未部署': '', '未导入': ''
};

function capState(id) {
  return (state.capLive && state.capLive.states[id]) || '未导入';
}

function capTone(id) {
  return CAP_TONE[capState(id)] || '';
}

function splitWire(wire) {
  const ops = [['>=', '不小于'], ['!~', '不包含'], ['~', '包含'], ['!=', '不等于'], ['=', '等于']];
  for (const [op, label] of ops) {
    const i = wire.indexOf(op);
    if (i > 0) return { key: wire.slice(0, i), need: `${label} ${wire.slice(i + op.length)}` };
  }
  if (wire.endsWith('+')) return { key: wire.slice(0, -1), need: '存在且非空' };
  return { key: wire, need: '—' };
}

function renderCapabilityPage() {
  const counts = { success: 0, warning: 0, danger: 0, '': 0 };
  for (const cap of CAPS) counts[capTone(cap.id)] += 1;

  const order = ['danger', 'warning', 'success', ''];
  const sorted = [...CAPS].sort((a, b) => {
    const d = order.indexOf(capTone(a.id)) - order.indexOf(capTone(b.id));
    return d !== 0 ? d : a.category.localeCompare(b.category, 'zh');
  });

  if (!state.capId || !sorted.some(c => c.id === state.capId)) {
    state.capId = sorted[0] ? sorted[0].id : null;
  }
  const selected = sorted.find(c => c.id === state.capId) || CAPS[0];

  const live = state.capLive;
  const extra = live && (live.replicaLow?.length || live.duplicates?.length)
    ? renderCapFindings(live) : '';

  return `
    <section class="hero compact cap-hero">
      <div>
        <p class="eyebrow">CAPABILITY MATRIX</p>
        <h1>产品有哪些能力，哪些其实没开</h1>
        <p>把「组件在跑」和「能力在用」分开看：依赖就绪只是第一步，配置真的指过去才算启用。</p>
      </div>
      <div class="hero-stat">
        <strong>${counts.success}</strong><span>已启用</span>
        <strong>${counts.warning}</strong><span>需注意</span>
        <strong>${counts.danger}</strong><span>有问题</span>
      </div>
    </section>

    <section class="panel cap-import">
      <div>
        <strong>${live ? '已导入采集结果' : '尚未导入采集结果'}</strong>
        <small>${live
          ? `${escapeHtml(live.importedAt)} · ${Object.keys(live.states).length} 项能力有状态`
          : '不导入也能查手册；导入后才知道「当前哪个能力没开」'}</small>
      </div>
      <div class="cap-import-actions">
        ${serverMode() ? '<button class="primary-button" id="cap-sync">从服务器同步</button>' : ''}
        <label class="ghost-button">选择能力矩阵.json
          <input id="cap-file" type="file" accept=".json,application/json">
        </label>
        ${live ? '<button class="ghost" id="cap-clear">清除数据</button>' : ''}
      </div>
      ${state.capError ? `<div class="notice danger"><strong>导入失败</strong><p>${escapeHtml(state.capError)}</p></div>` : ''}
      <p class="cap-import-hint">${serverMode()
        ? '服务器模式：可点「从服务器同步」拉取最新一次采集结果；也可以继续手工导入。'
        : '采集命令：<code>./bin/xt-blackbox capabilities --json &gt; 能力矩阵.json</code>，或用 <code>--push=http://服务器:8080/api/ingest</code> 直接推上来。'}</p>
    </section>

    ${extra}

    <div class="knowledge-layout">
      <section class="component-list" aria-label="能力列表">
        ${sorted.map(cap => `
          <button class="component-card cap-card ${state.capId === cap.id ? 'active' : ''}" data-cap="${escapeHtml(cap.id)}">
            <span class="cap-dot ${capTone(cap.id)}"></span>
            <span class="component-copy">
              <strong>${escapeHtml(cap.name)}</strong>
              <small>${escapeHtml(cap.brief)}</small>
            </span>
            <span class="component-badges">
              ${badge(capState(cap.id), capTone(cap.id))}
              ${badge(cap.category)}
            </span>
          </button>`).join('')}
      </section>
      <aside class="panel detail-panel">${renderCapDetail(selected)}</aside>
    </div>`;
}

function renderCapFindings(live) {
  const low = live.replicaLow || [];
  const dups = live.duplicates || [];
  return `
    <section class="panel cap-findings">
      <div class="section-heading">
        <div><p class="eyebrow">CROSS CHECKS</p><h2>跨能力检查</h2></div>
        <p>这两项不是单个能力的问题，是能力之间的关系</p>
      </div>
      ${low.length ? `
        <div class="finding-block">
          <h3>配置声明 vs 实际运行<span class="badge danger">${low.length} 项</span></h3>
          <p>配置里声明的副本数是 <strong>${escapeHtml(live.replicaHighCount)}</strong>，下面这些组件的实际副本低于声明值。
             要么没按新值重部署，要么该能力未生效。</p>
          <div class="finding-chips">
            ${low.slice(0, 14).map(x => `<span class="tag">${escapeHtml(x.ref)} <em>${escapeHtml(x.replicas)}</em></span>`).join('')}
          </div>
        </div>` : ''}
      ${dups.length ? `
        <div class="finding-block">
          <h3>同类组件重复部署<span class="badge warning">${dups.length} 组</span></h3>
          <p>同一个组件在集群里有多份，需要确认业务连的是哪一个。</p>
          ${dups.map(d => `
            <div class="dup-row">
              <strong>${escapeHtml(d.class)}</strong>
              <span class="badge ${d.cfgRefs ? 'success' : 'danger'}">配置里引用 ${d.cfgRefs} 次</span>
              ${d.members.map(m => `<span class="tag">${escapeHtml(m.ns)}/${escapeHtml(m.name)} <em>${escapeHtml(m.ready)}</em></span>`).join('')}
            </div>`).join('')}
        </div>` : ''}
    </section>`;
}

function renderCapDetail(cap) {
  if (!cap) return '<div class="empty">请选择能力</div>';
  const tone = capTone(cap.id);
  const sec = (label, body) => `<div class="cap-section"><h3>${escapeHtml(label)}</h3>${body}</div>`;

  return `
    <div class="detail-title">
      <div><p class="eyebrow">${escapeHtml(cap.category)}</p><h2>${escapeHtml(cap.name)}</h2></div>
      <div>${badge(capState(cap.id), tone)}</div>
    </div>
    <p class="detail-summary">${escapeHtml(cap.brief)}</p>

    ${cap.deps.length ? sec('依赖的对象', `<div class="tag-list">${cap.deps.map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('')}</div>`) : ''}

    ${cap.wires.length ? sec('判定条件', `
      <div class="cap-table">
        ${cap.wires.map(w => {
          const { key, need } = splitWire(w);
          return `<div class="cap-tr"><code>${escapeHtml(key)}</code><span>${escapeHtml(need)}</span></div>`;
        }).join('')}
      </div>`) : ''}

    ${cap.params.length ? sec('要改的参数', `
      <div class="cap-table">
        ${cap.params.map(p => `
          <div class="cap-tr param">
            <code>${escapeHtml(p.key)}</code>
            ${p.type ? badge(p.type) : ''}
            <span class="cap-expect">改成 ${escapeHtml(p.expect || '—')}</span>
            <small>${escapeHtml(p.source)}${p.desc ? ' · ' + escapeHtml(p.desc) : ''}</small>
          </div>`).join('')}
      </div>`) : ''}

    ${cap.apply.length ? sec('怎么改才生效', `
      <ol class="cap-steps">
        ${cap.apply.map(a => a.startsWith('!!')
          ? `<li class="warn">${escapeHtml(a.replace(/^!!\s*/, ''))}</li>`
          : `<li>${escapeHtml(a)}</li>`).join('')}
      </ol>`) : ''}

    ${cap.verify.length ? sec('改完怎么验证', `
      ${cap.verify.map(v => `
        <div class="cap-verify">
          <code>${escapeHtml(v.cmd)}</code>
          ${v.expect ? `<small>期望：<span class="cap-expect">${escapeHtml(v.expect)}</span></small>` : ''}
        </div>`).join('')}
      <p class="cap-tip">exec 必须指名 Pod，不要用 <code>deploy/</code> 前缀——滚动更新期间会命中旧 Pod。</p>`) : ''}

    ${(cap.impact || cap.note || cap.fallback || cap.source) ? sec('影响面与回滚', `
      <div class="cap-kv">
        ${cap.impact ? `<span>影响面</span><p>${escapeHtml(cap.impact)}</p>` : ''}
        ${cap.note ? `<span>风险</span><p>${escapeHtml(cap.note)}</p>` : ''}
        ${cap.fallback ? `<span>回滚</span><p>${escapeHtml(cap.fallback)}</p>` : ''}
        ${cap.source ? `<span>来源</span><p><small>${escapeHtml(cap.source)}</small></p>` : ''}
      </div>`) : ''}`;
}

function applyCapImport(text) {
  state.capError = '';
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (error) {
    state.capError = 'JSON 解析失败：' + error.message;
    return;
  }
  const list = Array.isArray(parsed) ? parsed : parsed.capabilities;
  if (!Array.isArray(list)) {
    state.capError = '找不到 capabilities 数组，请用 xt-blackbox capabilities --json 的输出。';
    return;
  }
  const known = new Set(CAPS.map(c => c.id));
  const states = {};
  let matched = 0;
  for (const item of list) {
    if (!item || !item.id || !known.has(item.id)) continue;
    states[item.id] = item.state || '未部署';
    matched += 1;
  }
  if (!matched) {
    state.capError = '没有任何能力 id 能对上，请确认是本工具产出的 JSON。';
    return;
  }
  state.capLive = {
    importedAt: parsed.generatedAt || new Date().toLocaleString('zh-CN'),
    states,
    replicaHighCount: parsed.replicaHighCount,
    replicaLow: Array.isArray(parsed.replicaLow) ? parsed.replicaLow : [],
    duplicates: Array.isArray(parsed.duplicates) ? parsed.duplicates : []
  };
  if (!state.capId) state.capId = CAPS[0] ? CAPS[0].id : null;
}

function serverMode() {
  return location.protocol === 'http:' || location.protocol === 'https:';
}

function syncFromServer(silent) {
  if (!serverMode()) return;
  fetch('/api/latest', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status === 404 ? '服务器上还没有采集结果' : '服务器返回 ' + r.status);
      return r.text();
    })
    .then(function (text) {
      applyCapImport(text);
      if (state.capLive) state.capLive.fromServer = true;
      render();
    })
    .catch(function (e) {
      if (!silent) { state.capError = '同步失败：' + e.message; render(); }
    });
}

function bindCapability() {
  if (serverMode() && !state.capLive && !state.capAutoTried) {
    state.capAutoTried = true;
    syncFromServer(true);
  }
  document.querySelectorAll('[data-cap]').forEach(button => button.addEventListener('click', () => {
    state.capId = button.dataset.cap;
    render();
  }));
  document.getElementById('cap-file')?.addEventListener('change', event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      applyCapImport(String(reader.result || ''));
      render();
    };
    reader.readAsText(file);
  });
  document.getElementById('cap-sync')?.addEventListener('click', () => {
    state.capError = '';
    syncFromServer(false);
  });
  document.getElementById('cap-clear')?.addEventListener('click', () => {
    state.capLive = null;
    state.capError = '';
    render();
  });
}

render();
</script>
